<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الطباعة المباشرة للملزمة</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#eef3f8;color:#17253a;margin:0}.wrap{max-width:760px;margin:30px auto;padding:16px}.card{background:#fff;padding:24px;border-radius:18px;box-shadow:0 8px 28px #0002}h1{margin-top:0;color:#0759a5}.info{background:#e8f4ff;border:1px solid #93cafa;padding:14px;border-radius:11px;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-weight:bold;display:block}input,select{width:100%;padding:12px;margin-top:7px;border:1px solid #bcc9d7;border-radius:10px;font-size:16px}.cover-option{display:flex;align-items:center;gap:10px;background:#ecf8f1;border:1px solid #9bd4b4;padding:13px;border-radius:10px;margin-top:15px}.cover-option input{width:auto;margin:0;transform:scale(1.25)}.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}button,a{border:0;border-radius:10px;padding:12px 18px;text-decoration:none;font-weight:bold;cursor:pointer}.send{background:#087f4f;color:#fff}.back{background:#607080;color:#fff}.warning{color:#8a5100;background:#fff2cd;padding:11px;border-radius:9px;margin-top:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{margin:8px auto;padding:8px}.card{padding:17px}}
</style></head><body><main class="wrap"><section class="card"><h1>إرسال ملزمة للطباعة المباشرة</h1><div id="material" class="info">جاري تحميل بيانات الملزمة…</div><form id="form"><div class="grid"><label>عدد النسخ<input id="copies" type="number" min="1" value="1" required></label><label>حجم الورق<select id="paper"><option>A4</option><option>A3</option></select></label><label>نوع الطباعة<select id="color" onchange="syncPrinter()"><option value="BW">أسود وأبيض</option><option value="COLOR">ملون</option></select></label><label>الطابعة<select id="printer"></select></label><label>طريقة الطباعة<select id="duplex"><option value="SIMPLEX">وجه واحد</option><option value="DUPLEX_LONG">وجهين — حافة طويلة</option><option value="DUPLEX_SHORT">وجهين — حافة قصيرة</option></select></label><label>التوزيع<select id="distribution" onchange="printer.disabled=this.value==='AUTO'"><option value="SINGLE">الطابعة المحددة</option><option value="AUTO">تلقائي حسب اللون والضغط</option></select></label></div><label class="cover-option"><input id="printCover" type="checkbox" checked> طباعة ورقة تعريف مستقلة أولاً (اسم الملزمة، التدريسي، وعدد الصفحات)</label><div class="warning">تأكد من اللون والطابعة وطريقة الوجه الواحد أو الوجهين قبل الإرسال. إذا كان خادم المكتبة يعمل فستبدأ الطباعة مباشرة.</div><div class="actions"><button class="send" type="submit">تأكيد وإرسال للطباعة المباشرة</button><a id="back" class="back" href="staff-materials.html">رجوع</a></div></form></section></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');const params=new URLSearchParams(location.search),id=Number(params.get('id')),returnPage=params.get('return')==='admin.html'?'admin.html':'staff-materials.html';back.href=returnPage;const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)};let item=null;
function syncPrinter(){const options=color.value==='COLOR'?[[8,'8 — ملون رئيسية'],[5,'5 — ملون احتياط']]:[[9,'9 — أسود وأبيض احتياط'],[1,'1 — أسود وأبيض'],[2,'2 — أسود وأبيض'],[3,'3 — أسود وأبيض']];printer.innerHTML=options.map(([v,t])=>`<option value="${v}">${t}</option>`).join('')}
async function load(){if(!Number.isInteger(id)||id<1){material.textContent='رقم الملزمة غير صحيح';form.hidden=true;return}const r=await api(`/api/staff/materials/${id}`),d=await r.json();if(!r.ok){material.textContent=d.error||'تعذر تحميل الملزمة';form.hidden=true;return}item=d.material;material.innerHTML=`<b>${String(item.title||'ملزمة').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}</b><br>الأستاذ: ${String(item.doctor_name||'-')} — الصفحات: ${item.page_count||'غير محسوبة'}`;syncPrinter()}
form.addEventListener('submit',async e=>{e.preventDefault();const mode=color.value,printerNumber=Number(printer.value),duplexMode=duplex.value,label=mode==='COLOR'?'ملون':'أسود وأبيض',face=duplexMode==='SIMPLEX'?'وجه واحد':'وجهين',destination=distribution.value==='AUTO'?'توزيع تلقائي':`الطابعة رقم ${printerNumber}`,coverLabel=printCover.checked?'مع ورقة تعريف':'من دون ورقة تعريف';if(!confirm(`تأكيد: ${item.title}\n${label} — ${face} — ${destination}\nعدد النسخ: ${copies.value}\n${coverLabel}`))return;const button=form.querySelector('button');button.disabled=true;const r=await api(`/api/materials/${id}/direct-print`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({copies:Number(copies.value),paperSize:paper.value,colorMode:mode,duplexMode,distribution:distribution.value,printerNumber,printCover:printCover.checked})}),d=await r.json();alert(d.message||d.error||'تمت العملية');button.disabled=false;if(r.ok)location.href=returnPage});load();
</script></body></html>
