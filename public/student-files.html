<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الطباعة</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f4f7fa;margin:0;color:#182234}.wrap{max-width:1200px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.header a{background:#25384d;color:white;text-decoration:none;padding:10px 16px;border-radius:10px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;padding:12px;border-radius:12px;margin-bottom:18px;position:sticky;top:0;z-index:5;box-shadow:0 3px 12px #0001}.batch{background:#7b3fa1;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.green{background:#128750}.blue{background:#0759a5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 6px 20px #0000000c;border-right:5px solid #0759a5}.choice{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:#65318a;font-weight:bold}.name{font-weight:bold;word-break:break-word;margin-bottom:14px}.meta{color:#667085;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer;text-decoration:none;font-weight:bold}.print{background:#149255}.download{background:#5d6d7e}.promote{background:#d98212}.done{background:#0759a5}.delete{background:#c73b3b}.empty{background:white;padding:40px;border-radius:16px;text-align:center;grid-column:1/-1}.counter{font-weight:bold;color:#0759a5}
</style></head><body><main class="wrap"><header class="header"><h1>ملفات الطلاب للطباعة</h1><a href="staff.html">بوابة الكادر</a></header><div class="toolbar"><label><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"> تحديد الكل</label><span id="counter" class="counter">0 محدد</span><button class="batch green" onclick="printSelected()">طباعة الملفات المحددة</button><button class="batch" onclick="printSelectedIds()">تنسيق الهويات المحددة A4</button><button class="batch blue" onclick="completeSelected()">تم إنجاز المحدد</button></div><section class="grid" id="list"><div class="empty">جاري التحميل…</div></section></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');const api=(url,options={})=>{options.headers=new Headers(options.headers||{});options.headers.set('Authorization',`Bearer ${token}`);return fetch(url,options)};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=[];
async function load(){const r=await api('/api/student-files');if(r.status===401)return location.replace('/staff.html');current=await r.json();list.innerHTML=current.length?current.map(f=>`<article class="card"><label class="choice"><input class="file-choice" type="checkbox" value="${f.id}" onchange="updateCount()"> تحديد هذا الملف</label><div class="name"><i class="fa fa-file" style="color:#d33"></i> ${esc(f.originalName)}</div>${f.printType==='ID_CARD'?'<div class="meta"><b>النوع:</b> هوية — الوجه والظهر</div>':''}${f.student_name?`<div class="meta"><b>الطالب:</b> ${esc(f.student_name)}</div>`:''}${f.phone?`<div class="meta"><b>الهاتف:</b> ${esc(f.phone)}</div>`:''}<div class="meta">النسخ: ${f.copies} — ${f.color_mode==='COLOR'?'ملون':'أسود وأبيض'}</div>${f.notes?`<div class="meta"><b>ملاحظات:</b> ${esc(f.notes)}</div>`:''}<div class="meta">الحالة: ${f.status}</div><div class="actions"><a class="btn print" href="${f.printType==='ID_CARD'?`/print-ids.html?ids=${f.id}`:f.url}" target="_blank" onclick="setStatus(${f.id},'PRINTING')">طباعة</a><a class="btn download" href="${f.url}" target="_blank" download>تحميل</a>${f.printType!=='ID_CARD'?`<button class="btn promote" onclick="promote(${f.id},'${esc(f.originalName)}')">تحويل إلى ملزمة</button>`:''}<button class="btn done" onclick="setStatus(${f.id},'COMPLETED')">تم الإنجاز</button><button class="btn delete" onclick="removeFile(${f.id})">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد طلبات طباعة حالياً</div>';updateCount()}
function chosen(){return [...document.querySelectorAll('.file-choice:checked')].map(x=>Number(x.value))}function toggleAll(on){document.querySelectorAll('.file-choice').forEach(x=>x.checked=on);updateCount()}function updateCount(){const n=chosen().length;counter.textContent=`${n} محدد`;selectAll.checked=current.length>0&&n===current.length;selectAll.indeterminate=n>0&&n<current.length}
function printSelectedIds(){const ids=chosen().filter(id=>current.find(f=>Number(f.id)===id)?.printType==='ID_CARD').slice(0,4);if(!ids.length)return alert('حدد هوية واحدة على الأقل');window.open(`/print-ids.html?ids=${ids.join(',')}`,'_blank')}
async function printSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');const docs=ids.map(id=>current.find(f=>Number(f.id)===id)).filter(Boolean),identityIds=docs.filter(f=>f.printType==='ID_CARD').map(f=>f.id).slice(0,4);if(identityIds.length)window.open(`/print-ids.html?ids=${identityIds.join(',')}`,'_blank');for(const f of docs.filter(x=>x.printType!=='ID_CARD')){window.open(f.url,'_blank');api(`/api/student-files/${f.id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'PRINTING'})})}alert('فُتحت الملفات المحددة للطباعة. الطباعة الصامتة المتتابعة ستعمل بعد تثبيت برنامج الطباعة على حاسبة المكتبة.')}
async function completeSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');if(!confirm(`تأكيد إنجاز ${ids.length} ملف؟`))return;await Promise.all(ids.map(id=>api(`/api/student-files/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'COMPLETED'})})));load()}
async function setStatus(id,status){await api(`/api/student-files/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(status==='COMPLETED')load()}async function removeFile(id){if(!confirm('حذف الملف نهائياً؟'))return;await api(`/api/student-files/${id}`,{method:'DELETE'});load()}
async function promote(id,originalName){const [dr,sr]=await Promise.all([fetch('/api/departments'),fetch('/api/stages')]);const departments=await dr.json(),stages=await sr.json();const title=prompt('اسم الملزمة:',originalName.replace(/\.[^.]+$/,''));if(!title)return;const doctorName=prompt('اسم الأستاذ / الدكتور:','')||'';const department=prompt('اكتب رمز القسم:\n'+departments.map(x=>`${x.code} = ${x.name}`).join('\n'));if(!department)return;const stage=prompt('اكتب رمز المرحلة:\n'+stages.map(x=>`${x.code} = ${x.name}`).join('\n'));if(!stage)return;const r=await api(`/api/student-files/${id}/promote-to-material`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,doctorName,department,stage})}),data=await r.json();alert(r.ok&&data.success?'تم تحويل الملف إلى ملزمة بنجاح':(data.error||'تعذر التحويل'))}
load();setInterval(()=>{if(!chosen().length)load()},20000);
</script></body></html>
