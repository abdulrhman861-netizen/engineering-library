<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الطباعة</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f4f7fa;margin:0;color:#182234}.wrap{max-width:1250px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.header a{background:#25384d;color:white;text-decoration:none;padding:10px 16px;border-radius:10px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;padding:12px;border-radius:12px;margin-bottom:12px;box-shadow:0 3px 12px #0001}.toolbar.sticky{position:sticky;top:0;z-index:5}.search{flex:1;min-width:240px;padding:11px;border:1px solid #aebdcb;border-radius:10px;font-size:16px}.batch{background:#7b3fa1;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:bold;cursor:pointer}.green{background:#128750}.blue{background:#0759a5}.danger{background:#c73b3b}.dark-danger{background:#7d1820}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 6px 20px #0000000c;border-right:5px solid #0759a5}.choice{display:flex;gap:8px;align-items:center;margin-bottom:10px;color:#65318a;font-weight:bold}.name{font-weight:bold;word-break:break-word;margin-bottom:14px}.meta{color:#667085;margin:8px 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer;text-decoration:none;font-weight:bold}.print{background:#149255}.download{background:#5d6d7e}.promote{background:#d98212}.done{background:#0759a5}.delete{background:#c73b3b}.direct{background:#6c35a5}.cancel-direct{background:#8b2432}.printer-select{padding:9px;border:1px solid #b9c4d0;border-radius:9px;background:#fff}.direct-state{padding:8px;border-radius:8px;background:#f1ebf8;color:#553070;font-size:.9rem}.empty{background:white;padding:40px;border-radius:16px;text-align:center;grid-column:1/-1}.counter{font-weight:bold;color:#0759a5}.result-count{color:#59697a;font-weight:bold}@media(max-width:650px){.wrap{padding:10px}.header h1{font-size:1.35rem}.toolbar{align-items:stretch}.toolbar>*{max-width:100%}}
</style></head><body><main class="wrap"><header class="header"><h1>ملفات الطلاب للطباعة</h1><a href="staff.html">بوابة الكادر</a></header>
<div class="toolbar"><input id="search" class="search" type="search" placeholder="ابحث باسم الملف، الطالب، الهاتف، رقم الطلب أو الملاحظات…" oninput="render()"><select id="statusFilter" class="printer-select" onchange="render()"><option value="">كل الحالات</option><option value="MANUAL">غير مرسل</option><option value="QUEUED">بانتظار الخادم</option><option value="CLAIMED">قيد الطباعة</option><option value="COMPLETED">مكتمل</option><option value="FAILED">فشل</option><option value="CANCELLED">ملغى</option></select><span id="resultCount" class="result-count"></span></div>
<div class="toolbar sticky"><label><input id="selectAll" type="checkbox" onchange="toggleAll(this.checked)"> تحديد الظاهر</label><span id="counter" class="counter">0 محدد</span><button class="batch green" onclick="printSelected()">طباعة الملفات المحددة</button><button class="batch" onclick="printSelectedIds()">تنسيق الهويات المحددة A4</button><button class="batch blue" onclick="completeSelected()">تم إنجاز المحدد</button><button class="batch danger" onclick="deleteSelected()"><i class="fa fa-trash"></i> حذف المحدد</button><button id="deleteAllButton" class="batch dark-danger" onclick="deleteAllFiles()" hidden><i class="fa fa-trash-can"></i> حذف الكل</button></div>
<div class="toolbar"><b>إعدادات الطباعة المباشرة:</b><label>نسخ <input id="batchCopies" type="number" min="1" value="1" style="width:65px;padding:8px"></label><select id="batchPaper" class="printer-select"><option>A4</option><option>A3</option></select><select id="batchDuplex" class="printer-select"><option value="SIMPLEX">وجه واحد</option><option value="DUPLEX_LONG">وجهين — حافة طويلة</option><option value="DUPLEX_SHORT">وجهين — حافة قصيرة</option></select><select id="batchColor" class="printer-select" onchange="batchPrinter.value=this.value==='COLOR'?'8':'9'"><option value="BW">أسود وأبيض</option><option value="COLOR">ملون</option></select><select id="batchDistribution" class="printer-select"><option value="SINGLE">طابعة واحدة — الاختيار أدناه</option><option value="AUTO">توزيع تلقائي حسب اللون والضغط</option></select><select id="batchPrinter" class="printer-select" onchange="batchDistribution.value='SINGLE';batchColor.value=['8','5'].includes(this.value)?'COLOR':'BW'"><option value="9">9 أسود وأبيض</option><option value="1">1 أسود وأبيض</option><option value="2">2 أسود وأبيض</option><option value="3">3 أسود وأبيض</option><option value="8">8 ملون</option><option value="5">5 ملون احتياط</option></select><button class="batch green" onclick="directSelected()">إرسال المحدد مباشرة</button></div>
<section class="grid" id="list"><div class="empty">جاري التحميل…</div></section></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');let role=localStorage.getItem('employeeRole')||'';deleteAllButton.hidden=role!=='ADMIN';const api=(url,options={})=>{options.headers=new Headers(options.headers||{});options.headers.set('Authorization',`Bearer ${token}`);return fetch(url,options)};const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let current=[];
function printerOptions(f){const color=f.color_mode==='COLOR',recommended=color?8:9,printers=color?[[8,'8 — ملون رئيسية'],[5,'5 — ملون احتياط']]:[[9,'9 — أسود وأبيض احتياط'],[1,'1 — أسود وأبيض'],[2,'2 — أسود وأبيض'],[3,'3 — أسود وأبيض']];return printers.map(([n,label])=>`<option value="${n}" ${Number(f.printerNumber||recommended)===n?'selected':''}>${label}</option>`).join('')}
function directState(f){const names={MANUAL:'غير مرسل',QUEUED:'بانتظار الخادم',CLAIMED:'قيد الطباعة',COMPLETED:'طُبع مباشرة',FAILED:'فشل — يمكن إعادة الإرسال',CANCELLED:'ملغى'};return names[f.directPrintStatus||'MANUAL']||f.directPrintStatus}
function visibleFiles(){const q=search.value.trim().toLowerCase(),status=statusFilter.value;return current.filter(f=>{const hay=[f.id,f.originalName,f.student_name,f.student_number,f.phone,f.notes,f.status,f.directPrintStatus].join(' ').toLowerCase();return(!q||hay.includes(q))&&(!status||(f.directPrintStatus||'MANUAL')===status)})}
function render(){const files=visibleFiles();resultCount.textContent=`النتائج: ${files.length} من ${current.length}`;list.innerHTML=files.length?files.map(f=>`<article class="card"><label class="choice"><input class="file-choice" type="checkbox" value="${f.id}" onchange="updateCount()"> تحديد هذا الملف — طلب #${f.id}</label><div class="name"><i class="fa fa-file" style="color:#d33"></i> ${esc(f.originalName)}</div>${f.printType==='ID_CARD'?'<div class="meta"><b>النوع:</b> هوية — الوجه والظهر</div>':''}${f.student_name?`<div class="meta"><b>الطالب:</b> ${esc(f.student_name)}</div>`:''}${f.phone?`<div class="meta"><b>الهاتف:</b> ${esc(f.phone)}</div>`:''}<div class="meta">النسخ: ${f.copies} — ${f.color_mode==='COLOR'?'ملون':'أسود وأبيض'} — الصفحات: ${f.pageCount||'غير محسوب'}</div>${f.notes?`<div class="meta"><b>ملاحظات:</b> ${esc(f.notes)}</div>`:''}<div class="meta">الحالة: ${esc(f.status)}</div><div class="direct-state">الطباعة المباشرة: ${directState(f)}${f.printError?` — ${esc(f.printError)}`:''}</div><div class="actions"><select class="printer-select" id="printer-${f.id}">${printerOptions(f)}</select><select class="printer-select" id="duplex-${f.id}"><option value="SIMPLEX" selected>وجه واحد</option><option value="DUPLEX_LONG">وجهين — حافة طويلة</option><option value="DUPLEX_SHORT">وجهين — حافة قصيرة</option></select><button class="btn direct" onclick="directPrint(${f.id})">إرسال للطباعة المباشرة</button>${['QUEUED','FAILED'].includes(f.directPrintStatus)?`<button class="btn cancel-direct" onclick="cancelDirect(${f.id})">إلغاء الطباعة</button>`:''}<a class="btn print" href="${f.printType==='ID_CARD'?`/print-ids.html?ids=${f.id}`:f.url}" target="_blank" onclick="setStatus(${f.id},'PRINTING')">طباعة تقليدية</a><a class="btn download" href="${f.url}" target="_blank" download>تحميل</a>${f.printType!=='ID_CARD'?`<button class="btn promote" onclick="promote(${f.id},'${esc(f.originalName)}')">تحويل إلى ملزمة</button>`:''}<button class="btn done" onclick="setStatus(${f.id},'COMPLETED')">تم الإنجاز</button><button class="btn delete" onclick="removeFile(${f.id})">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد ملفات مطابقة للبحث</div>';updateCount()}
async function load(){const r=await api('/api/student-files');if(r.status===401)return location.replace('/staff.html');current=await r.json();render()}function chosen(){return[...document.querySelectorAll('.file-choice:checked')].map(x=>Number(x.value))}function toggleAll(on){document.querySelectorAll('.file-choice').forEach(x=>x.checked=on);updateCount()}function updateCount(){const n=chosen().length,visible=document.querySelectorAll('.file-choice').length;counter.textContent=`${n} محدد`;selectAll.checked=visible>0&&n===visible;selectAll.indeterminate=n>0&&n<visible}
function printSelectedIds(){const ids=chosen().filter(id=>current.find(f=>Number(f.id)===id)?.printType==='ID_CARD').slice(0,4);if(!ids.length)return alert('حدد هوية واحدة على الأقل');window.open(`/print-ids.html?ids=${ids.join(',')}`,'_blank')}async function printSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');const docs=ids.map(id=>current.find(f=>Number(f.id)===id)).filter(Boolean),identityIds=docs.filter(f=>f.printType==='ID_CARD').map(f=>f.id).slice(0,4);if(identityIds.length)window.open(`/print-ids.html?ids=${identityIds.join(',')}`,'_blank');for(const f of docs.filter(x=>x.printType!=='ID_CARD')){window.open(f.url,'_blank');api(`/api/student-files/${f.id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'PRINTING'})})}alert('فُتحت الملفات المحددة للطباعة.')}async function completeSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');if(!confirm(`تأكيد إنجاز ${ids.length} ملف؟`))return;await Promise.all(ids.map(id=>api(`/api/student-files/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'COMPLETED'})})));load()}
async function bulkDelete(payload,label){if(!confirm(`تحذير: سيتم حذف ${label} نهائياً من القائمة والتخزين. لا يمكن التراجع.\nهل تريد المتابعة؟`))return;const r=await api('/api/student-files/bulk-delete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}),d=await r.json();alert(d.message||d.error||'تمت العملية');if(r.ok)load()}function deleteSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');bulkDelete({ids},`${ids.length} ملف محدد`)}function deleteAllFiles(){if(role!=='ADMIN')return alert('هذه العملية للمدير فقط');bulkDelete({all:true},'جميع ملفات الطباعة الموجودة في النظام')}
async function setStatus(id,status){await api(`/api/student-files/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(status==='COMPLETED')load()}async function removeFile(id){if(!confirm('حذف الملف نهائياً؟'))return;const r=await api(`/api/student-files/${id}`,{method:'DELETE'}),d=await r.json();if(!r.ok)return alert(d.error||'تعذر الحذف');load()}
async function directPrint(id){const printerNumber=Number(document.getElementById(`printer-${id}`).value),duplexMode=document.getElementById(`duplex-${id}`).value,duplexLabel=duplexMode==='SIMPLEX'?'وجه واحد':duplexMode==='DUPLEX_LONG'?'وجهين — حافة طويلة':'وجهين — حافة قصيرة';if(!confirm(`تأكيد الطباعة على الطابعة رقم ${printerNumber} — ${duplexLabel}؟`))return;const r=await api(`/api/student-files/${id}/direct-print`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({printerNumber,duplexMode})}),d=await r.json();alert(r.ok?`${d.message} — ${duplexLabel}`:(d.error||'تعذر إرسال الطباعة'));load()}async function directSelected(){const ids=chosen();if(!ids.length)return alert('حدد ملفاً واحداً على الأقل');const printerNumber=Number(batchPrinter.value),colorMode=batchColor.value,distribution=batchDistribution.value,colorLabel=colorMode==='COLOR'?'ملون':'أسود وأبيض',destination=distribution==='SINGLE'?`الطابعة رقم ${printerNumber}`:'التوزيع التلقائي';if(distribution==='SINGLE'&&((colorMode==='COLOR'&&![5,8].includes(printerNumber))||(colorMode==='BW'&&![1,2,3,9].includes(printerNumber))))return alert('الطابعة المحددة لا تطابق نوع اللون.');if(!confirm(`تأكيد طباعة ${ids.length} ملف — ${colorLabel} — ${destination}؟`))return;const body={ids,copies:Math.max(1,Number(batchCopies.value)||1),paperSize:batchPaper.value,duplexMode:batchDuplex.value,distribution,printerNumber,overrideColor:true,colorMode};const r=await api('/api/student-files/batch-direct-print',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();alert(d.message||d.error||'تمت العملية');load()}async function cancelDirect(id){if(!confirm('إلغاء أمر الطباعة قبل أن يستلمه الخادم؟'))return;const r=await api(`/api/student-files/${id}/cancel-direct`,{method:'POST'}),d=await r.json();alert(d.message||d.error);load()}
async function promote(id,originalName){const[dr,sr]=await Promise.all([fetch('/api/departments'),fetch('/api/stages')]),departments=await dr.json(),stages=await sr.json(),title=prompt('اسم الملزمة:',originalName.replace(/\.[^.]+$/,''));if(!title)return;const doctorName=prompt('اسم الأستاذ / الدكتور:','')||'',department=prompt('اكتب رمز القسم:\n'+departments.map(x=>`${x.code} = ${x.name}`).join('\n'));if(!department)return;const stage=prompt('اكتب رمز المرحلة:\n'+stages.map(x=>`${x.code} = ${x.name}`).join('\n'));if(!stage)return;const r=await api(`/api/student-files/${id}/promote-to-material`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,doctorName,department,stage})}),data=await r.json();alert(r.ok&&data.success?'تم تحويل الملف إلى ملزمة بنجاح':(data.error||'تعذر التحويل'))}
api('/api/admin/session').then(async r=>{if(r.ok){const d=await r.json();role=d.role;deleteAllButton.hidden=role!=='ADMIN'}}).catch(()=>{});load();setInterval(()=>{if(!chosen().length&&!search.value)load()},20000);
</script><script src="/staff-chat-alerts.js"></script></body></html>
