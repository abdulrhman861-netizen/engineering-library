<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات الطباعة</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f4f7fa;margin:0;color:#182234}.wrap{max-width:1100px;margin:auto;padding:24px}.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.header a{background:#25384d;color:white;text-decoration:none;padding:10px 16px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.card{background:white;padding:20px;border-radius:16px;box-shadow:0 6px 20px #0000000c;border-right:5px solid #0759a5}.name{font-weight:bold;word-break:break-word;margin-bottom:14px}.meta{color:#667085;margin:8px 0}.actions{display:flex;gap:8px;margin-top:16px}.btn{border:0;border-radius:9px;padding:10px 14px;color:white;cursor:pointer;text-decoration:none;font-weight:bold}.print{background:#149255}.done{background:#0759a5}.delete{background:#c73b3b}.empty{background:white;padding:40px;border-radius:16px;text-align:center;grid-column:1/-1}
</style></head><body><main class="wrap"><header class="header"><h1>ملفات الطلاب للطباعة</h1><a href="staff.html">بوابة الكادر</a></header><section class="grid" id="list"><div class="empty">جاري التحميل…</div></section></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');
const api=(url,options={})=>{options.headers=new Headers(options.headers||{});options.headers.set('Authorization',`Bearer ${token}`);return fetch(url,options)};
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const r=await api('/api/student-files');if(r.status===401)return location.replace('/staff.html');const files=await r.json(),box=document.getElementById('list');box.innerHTML=files.length?files.map(f=>`<article class="card"><div class="name"><i class="fa fa-file" style="color:#d33"></i> ${esc(f.originalName)}</div>${f.printType==='ID_CARD'?'<div class="meta"><b>النوع:</b> طباعة هوية — الوجه والظهر</div>':''}${f.student_name?`<div class="meta"><b>الطالب:</b> ${esc(f.student_name)}</div>`:''}${f.phone?`<div class="meta"><b>الهاتف:</b> ${esc(f.phone)}</div>`:''}<div class="meta">النسخ: ${f.copies} — ${f.color_mode==='COLOR'?'ملون':'أسود وأبيض'}</div>${f.notes?`<div class="meta"><b>ملاحظات:</b> ${esc(f.notes)}</div>`:''}<div class="meta">الحالة: ${f.status}</div><div class="actions"><a class="btn print" href="${f.printType==='ID_CARD'?`/print-id.html?id=${f.id}`:f.url}" target="_blank" onclick="setStatus(${f.id},'PRINTING')">طباعة</a><button class="btn done" onclick="setStatus(${f.id},'COMPLETED')">تم الإنجاز</button><button class="btn delete" onclick="removeFile(${f.id})">حذف</button></div></article>`).join(''):'<div class="empty">لا توجد طلبات طباعة حالياً</div>'}
async function setStatus(id,status){await api(`/api/student-files/${id}/status`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(status==='COMPLETED')load()}
async function removeFile(id){if(!confirm('حذف الملف نهائياً؟'))return;await api(`/api/student-files/${id}`,{method:'DELETE'});load()}
load();setInterval(load,15000);
</script></body></html>
