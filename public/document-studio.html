<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو المستمسكات</title><link rel="stylesheet" href="/document-studio.css"></head><body>
<header class="bar"><div><b>استوديو المستمسكات</b><small>رفع وقص وترتيب من دون سكانر</small></div><a href="quick-print.html">العودة للسحب السريع</a></header>
<main class="layout">
  <aside class="side"><h2>باقات المعاملات</h2><label>الباقة<select id="packageSelect"></select></label><div class="package-actions"><button id="newPackage">باقة جديدة</button><button class="danger" id="deletePackage">حذف</button></div><div id="documents"></div><button id="addDocument" class="wide">+ إضافة مستمسك</button><p class="privacy">🔒 الصور تعالج داخل المتصفح ولا تُرسل إلا عند الضغط على «إرسال للطباعة».</p></aside>
  <section class="workspace">
    <div class="tools"><label>الترتيب<select id="layoutMode"><option value="side">متجاوران</option><option value="stack">تحت بعض</option></select></label><label><input id="cropMarks" type="checkbox" checked> خطوط القص</label><label>المسافة أفقياً <input id="gapX" type="range" min="0" max="30" value="5"><output id="gapXOut">5 ملم</output></label><label>عمودياً <input id="gapY" type="range" min="0" max="30" value="5"><output id="gapYOut">5 ملم</output></label></div>
    <h1>معاينة ورقة A4</h1><div class="paper-wrap"><canvas id="sheet" width="1240" height="1754"></canvas></div>
    <div class="footer"><span id="summary">ورقة A4 — صفحة واحدة</span><button id="exportImage">تصدير صورة</button><button id="exportPdf">تصدير PDF</button><button id="printNow" class="primary">طباعة مباشرة</button><button id="sendQueue" class="success">إرسال لقائمة الطباعة</button></div>
  </section>
</main>
<dialog id="editor"><form method="dialog"><header><h2 id="editorTitle">تحرير الصورة</h2><button value="cancel">✕</button></header><div class="editor-layout"><div class="edit-stage"><canvas id="editCanvas" width="1100" height="760"></canvas></div><aside class="edit-tools"><button type="button" id="autoCrop">تعرّف تلقائي</button><button type="button" id="manualCrop">قص يدوي</button><button type="button" id="rotate">تدوير 90°</button><button type="button" id="deskew">تصحيح الميلان</button><button type="button" id="enhance">تحسين الألوان</button><button type="button" id="flatten">تبييض الخلفية</button><label>السطوع<input id="brightness" type="range" min="60" max="160" value="100"></label><label>التباين<input id="contrast" type="range" min="60" max="180" value="100"></label><button type="button" id="restore">استعادة الأصل</button></aside></div><footer><button value="cancel">إلغاء</button><button value="default" id="applyEdit" class="primary">تطبيق القص</button></footer></form></dialog>
<input id="filePicker" type="file" accept="image/*" hidden><script src="/document-studio.js"></script></body></html>
