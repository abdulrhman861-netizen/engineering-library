<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر المستمسكات والصور</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#eef3f7;margin:0;color:#172033}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{background:#25384d;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(410px,1fr));gap:18px}.card,.form{background:#fff;padding:18px;border-radius:16px;box-shadow:0 5px 18px #0001}.stage{position:relative;background:#1e2530;border-radius:12px;overflow:hidden;touch-action:none;min-height:280px}.stage canvas{display:block;width:100%;height:auto;cursor:crosshair}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.toolbar button,.pick{border:0;border-radius:9px;padding:9px 11px;color:#fff;background:#0759a5;font-weight:700;cursor:pointer}.toolbar .auto{background:#7b3fa1}.toolbar .free{background:#c56b09}.toolbar .reset{background:#59697d}.toolbar button.active{outline:3px solid #f2c94c}.pick{display:block;text-align:center;margin-bottom:10px}.pick input{display:none}.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls label{display:grid;grid-template-columns:65px 1fr 38px;gap:6px;align-items:center;font-size:13px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields input,.fields select,.fields textarea{width:100%;padding:11px;border:1px solid #ccd4de;border-radius:9px}.send{width:100%;padding:14px;background:#118757;color:#fff;border:0;border-radius:12px;font-weight:bold;font-size:1.05rem;cursor:pointer;margin-top:12px}.hint{background:#fff3cd;padding:12px;border-radius:10px;line-height:1.8}.status{margin-top:10px;font-weight:bold}.mode-note{color:#5f6f82;font-size:13px;margin:8px 0}.badge{background:#eaf2ff;color:#0759a5;padding:4px 8px;border-radius:20px;font-size:12px}@media(max-width:600px){.grid,.fields,.controls{grid-template-columns:1fr}.card{padding:12px}.stage{min-height:220px}}
</style></head><body><main class="wrap"><header class="top"><h1>محرر المستمسكات والصور</h1><a href="quick-print.html">العودة للسحب السريع</a></header><p class="hint"><b>الجديد:</b> اضغط «تعرّف تلقائي» لتحديد حدود المستمسك، أو اختر «تحديد حر» واسحب أي مستطيل بالحجم الذي تريده. اسحب داخل الإطار لتحريك التحديد، واسحب المقابض الزرقاء لتغيير حجمه.</p><section class="grid" id="editors"></section><section class="form"><div class="fields"><input id="studentName" placeholder="اسم الطالب أو مستطرق"><input id="phone" placeholder="رقم الهاتف أو مستطرق"><select id="colorMode"><option value="COLOR">ملون</option><option value="BW">أسود وأبيض</option></select><input id="copies" type="number" min="1" value="1" placeholder="عدد النسخ"><textarea id="notes" placeholder="ملاحظات"></textarea></div><button class="send" onclick="submitImages()" id="sendButton">إرسال الصور بعد القص للمكتبة</button><div class="status" id="status"></div></section></main><script>
const mode=new URLSearchParams(location.search).get('mode')||'id',documentMode=mode==='document',passportMode=mode==='passport';
const states=documentMode?[{label:'المستمسك أو الصورة'}]:[{label:'وجه الهوية'},{label:'ظهر الهوية'},...(passportMode?[{label:'صورة الجواز'}]:[])];
const W=1200,H=800,handleRadius=18;
function editor(s,i){return `<article class="card"><h2>${s.label} <span class="badge" id="ratioName${i}">${documentMode?'تحديد حر':'هوية'}</span></h2><label class="pick">اختيار أو سحب الصورة<input type="file" accept="image/*" onchange="loadImage(${i},this.files[0])"></label><div class="toolbar"><button class="auto" onclick="autoDetect(${i})">✨ تعرّف تلقائي</button><button class="free" onclick="setRatio(${i},0,this)">✂️ تحديد حر</button><button onclick="setRatio(${i},85.6/54,this)">🪪 هوية</button><button onclick="setRatio(${i},125/88,this)">🛂 جواز</button><button onclick="setRatio(${i},210/297,this)">📄 A4</button><button onclick="rotateImage(${i})">↻ تدوير</button><button class="reset" onclick="resetCrop(${i})">إعادة</button></div><div class="stage" id="stage${i}"><canvas id="canvas${i}" width="${W}" height="${H}"></canvas></div><p class="mode-note">اسحب داخل التحديد لتحريكه، أو اسحب الزوايا الزرقاء لتغيير حجمه. الجزء داخل المستطيل فقط سيُرسل.</p><div class="controls">${[['brightness','إضاءة',60,160,100],['contrast','تباين',60,180,100]].map(([k,l,min,max,val])=>`<label><span>${l}</span><input id="${k}${i}" type="range" min="${min}" max="${max}" value="${val}" oninput="render(${i})"><output id="${k}Out${i}">${val}</output></label>`).join('')}</div></article>`}
editors.innerHTML=states.map(editor).join('');
states.forEach((s,i)=>{s.ratio=documentMode?0:85.6/54;s.crop={x:150,y:150,w:900,h:500};s.rotation=0;wireCanvas(i);render(i)});
function val(k,i){return Number(document.getElementById(k+i).value)}
function loadImage(i,file){if(!file)return;const s=states[i];if(s.url)URL.revokeObjectURL(s.url);s.file=file;s.url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{s.image=img;s.rotation=0;fitImage(i);resetCrop(i)};img.src=s.url}
function rotatedSize(s){return s.rotation%180?{w:s.image.height,h:s.image.width}:{w:s.image.width,h:s.image.height}}
function fitImage(i){const s=states[i],z=rotatedSize(s),scale=Math.min(W/z.w,H/z.h);s.draw={x:(W-z.w*scale)/2,y:(H-z.h*scale)/2,w:z.w*scale,h:z.h*scale,scale}}
function resetCrop(i){const s=states[i];if(!s.image){render(i);return}const d=s.draw,p=.06;let w=d.w*(1-p*2),h=d.h*(1-p*2);if(s.ratio){if(w/h>s.ratio)w=h*s.ratio;else h=w/s.ratio}s.crop={x:d.x+(d.w-w)/2,y:d.y+(d.h-h)/2,w,h};render(i)}
function setRatio(i,ratio,button){const s=states[i];s.ratio=ratio;document.getElementById(`ratioName${i}`).textContent=ratio===0?'تحديد حر':Math.abs(ratio-85.6/54)<.01?'هوية':Math.abs(ratio-125/88)<.01?'جواز':'A4';button?.parentElement.querySelectorAll('button').forEach(b=>b.classList.toggle('active',b===button));resetCrop(i)}
function rotateImage(i){const s=states[i];if(!s.image)return;s.rotation=(s.rotation+90)%360;fitImage(i);resetCrop(i)}
function drawSource(c,s,i){const d=s.draw;c.save();c.translate(W/2,H/2);c.rotate(s.rotation*Math.PI/180);const dw=s.image.width*d.scale,dh=s.image.height*d.scale;c.filter=`brightness(${val('brightness',i)}%) contrast(${val('contrast',i)}%)`;c.drawImage(s.image,-dw/2,-dh/2,dw,dh);c.restore()}
function render(i){['brightness','contrast'].forEach(k=>{const o=document.getElementById(`${k}Out${i}`);if(o)o.value=val(k,i)});const s=states[i],canvas=document.getElementById(`canvas${i}`),c=canvas.getContext('2d');c.clearRect(0,0,W,H);c.fillStyle='#202833';c.fillRect(0,0,W,H);if(!s.image){c.fillStyle='#d7e1ed';c.font='bold 34px Tahoma';c.textAlign='center';c.fillText('اختر أو اسحب صورة هنا',W/2,H/2);return}drawSource(c,s,i);const q=s.crop;c.save();c.fillStyle='rgba(0,0,0,.58)';c.beginPath();c.rect(0,0,W,H);c.rect(q.x,q.y,q.w,q.h);c.fill('evenodd');c.strokeStyle='#32a9ff';c.lineWidth=6;c.strokeRect(q.x,q.y,q.w,q.h);c.fillStyle='#32a9ff';handles(q).forEach(p=>{c.beginPath();c.arc(p.x,p.y,handleRadius,0,Math.PI*2);c.fill()});c.restore()}
function handles(q){return[{key:'nw',x:q.x,y:q.y},{key:'ne',x:q.x+q.w,y:q.y},{key:'sw',x:q.x,y:q.y+q.h},{key:'se',x:q.x+q.w,y:q.y+q.h}]}
function point(canvas,e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function wireCanvas(i){const canvas=document.getElementById(`canvas${i}`),s=states[i];canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();loadImage(i,e.dataTransfer.files[0])};canvas.onpointerdown=e=>{if(!s.image)return;const p=point(canvas,e),h=handles(s.crop).find(x=>Math.hypot(x.x-p.x,x.y-p.y)<35);s.drag={type:h?h.key:(p.x>=s.crop.x&&p.x<=s.crop.x+s.crop.w&&p.y>=s.crop.y&&p.y<=s.crop.y+s.crop.h?'move':'new'),start:p,original:{...s.crop}};if(s.drag.type==='new')s.crop={x:p.x,y:p.y,w:1,h:1};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!s.drag)return;const p=point(canvas,e),g=s.drag,o=g.original;if(g.type==='move'){s.crop.x=o.x+p.x-g.start.x;s.crop.y=o.y+p.y-g.start.y}else if(g.type==='new'){let x=Math.min(g.start.x,p.x),y=Math.min(g.start.y,p.y),w=Math.abs(p.x-g.start.x),h=Math.abs(p.y-g.start.y);s.crop=applyRatio({x,y,w,h},s.ratio,'se',g.start)}else{s.crop=resizeCrop(o,p,g.type,s.ratio)}clampCrop(s.crop);render(i)};canvas.onpointerup=canvas.onpointercancel=e=>{s.drag=null;try{canvas.releasePointerCapture(e.pointerId)}catch{}}}
function applyRatio(q,ratio,corner,anchor){if(!ratio)return q;if(q.w/Math.max(1,q.h)>ratio)q.w=q.h*ratio;else q.h=q.w/ratio;if(corner.includes('w'))q.x=anchor.x-q.w;if(corner.includes('n'))q.y=anchor.y-q.h;return q}
function resizeCrop(o,p,key,ratio){const ax=key.includes('w')?o.x+o.w:o.x,ay=key.includes('n')?o.y+o.h:o.y;let q={x:Math.min(ax,p.x),y:Math.min(ay,p.y),w:Math.max(40,Math.abs(p.x-ax)),h:Math.max(40,Math.abs(p.y-ay))};return applyRatio(q,ratio,key,{x:ax,y:ay})}
function clampCrop(q){q.w=Math.max(20,Math.min(W,q.w));q.h=Math.max(20,Math.min(H,q.h));q.x=Math.max(0,Math.min(W-q.w,q.x));q.y=Math.max(0,Math.min(H-q.h,q.y))}
function autoDetect(i){const s=states[i];if(!s.image)return alert('اختر الصورة أولاً');const tmp=document.createElement('canvas');tmp.width=W;tmp.height=H;const c=tmp.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,W,H);drawSource(c,s,i);const data=c.getImageData(0,0,W,H).data,step=4;let minX=W,minY=H,maxX=0,maxY=0,count=0;const corners=[[8,8],[W-9,8],[8,H-9],[W-9,H-9]],bg=corners.reduce((a,[x,y])=>{const k=(y*W+x)*4;return[a[0]+data[k],a[1]+data[k+1],a[2]+data[k+2]]},[0,0,0]).map(v=>v/4);for(let y=0;y<H;y+=step)for(let x=0;x<W;x+=step){const k=(y*W+x)*4,d=Math.abs(data[k]-bg[0])+Math.abs(data[k+1]-bg[1])+Math.abs(data[k+2]-bg[2]);if(d>75){minX=Math.min(minX,x);minY=Math.min(minY,y);maxX=Math.max(maxX,x);maxY=Math.max(maxY,y);count++}}if(count<100)return resetCrop(i);s.crop={x:minX-12,y:minY-12,w:maxX-minX+24,h:maxY-minY+24};clampCrop(s.crop);s.ratio=0;document.getElementById(`ratioName${i}`).textContent='تلقائي حر';render(i)}
async function exportImage(i){const s=states[i];if(!s.image)throw new Error(`اختر صورة ${s.label}`);const full=document.createElement('canvas');full.width=W;full.height=H;const fc=full.getContext('2d');fc.fillStyle='#fff';fc.fillRect(0,0,W,H);drawSource(fc,s,i);const q=s.crop,scale=Math.min(3,2200/Math.max(q.w,q.h)),out=document.createElement('canvas');out.width=Math.max(1,Math.round(q.w*scale));out.height=Math.max(1,Math.round(q.h*scale));out.getContext('2d').drawImage(full,q.x,q.y,q.w,q.h,0,0,out.width,out.height);return new Promise(resolve=>out.toBlob(resolve,'image/jpeg',.94))}
async function submitImages(){try{status.textContent='جاري تجهيز الصور...';const images=await Promise.all(states.map((_,i)=>exportImage(i))),fd=new FormData();images.forEach((blob,i)=>fd.append('files',blob,documentMode?'document-cropped.jpg':['id-front.jpg','id-back.jpg','passport.jpg'][i]));fd.append('printType',documentMode?'DOCUMENT':passportMode?'ID_PASSPORT':'ID_CARD');fd.append('studentName',studentName.value.trim()||'مستطرق');fd.append('phone',phone.value.trim()||'مستطرق');fd.append('colorMode',colorMode.value);fd.append('copies',copies.value||1);fd.append('notes',notes.value.trim());status.textContent='جاري الرفع...';const headers={},token=localStorage.getItem('employeeToken');if(token)headers.Authorization=`Bearer ${token}`;const r=await fetch('/upload-student-file',{method:'POST',headers,body:fd}),d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'تعذر الرفع');status.textContent='✅ تم إرسال الصور بعد القص بنجاح';alert('تم إرسال المستمسكات للمكتبة');}catch(e){status.textContent=`❌ ${e.message}`}}
sendButton.textContent=documentMode?'إرسال المستمسك المقصوص للطباعة':'إرسال الهوية بعد القص والترتيب';
</script><script src="/notifications.js"></script></body></html>
