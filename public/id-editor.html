<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محرر صور الهوية</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#eef3f7;margin:0;color:#172033}.wrap{max-width:1050px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.top a{background:#25384d;color:#fff;text-decoration:none;padding:10px 14px;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card,.form{background:#fff;padding:18px;border-radius:16px;box-shadow:0 5px 18px #0001}.frame{width:100%;aspect-ratio:85.6/54;background:#222;overflow:hidden;border:3px dashed #7b3fa1;border-radius:12px;position:relative}.frame img{width:100%;height:100%;object-fit:cover;transform-origin:center;user-select:none;pointer-events:none}.controls label{display:grid;grid-template-columns:85px 1fr 40px;gap:7px;align-items:center;margin:9px 0}.pick{display:block;text-align:center;background:#0759a5;color:#fff;padding:11px;border-radius:10px;cursor:pointer;margin:10px 0}.pick input{display:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fields input,.fields select,.fields textarea{width:100%;padding:11px;border:1px solid #ccd4de;border-radius:9px}.send{width:100%;padding:14px;background:#118757;color:#fff;border:0;border-radius:12px;font-weight:bold;font-size:1.05rem;cursor:pointer;margin-top:12px}.hint{background:#fff3cd;padding:12px;border-radius:10px}.status{margin-top:10px;font-weight:bold}@media(max-width:750px){.grid,.fields{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><header class="top"><h1>محرر الهوية الذكي</h1><a href="upload.html">العودة للرفع</a></header><p class="hint">اختر الوجه والظهر، ثم حرّك منزلقات التكبير والموقع والدوران حتى يظهر المستمسك وحده داخل الإطار. سيُطبع بقياس الهوية بجانب الوجه الآخر على ورقة A4.</p><section class="grid" id="editors"></section><section class="form"><div class="fields"><input id="studentName" placeholder="اسم الطالب أو مستطرق"><input id="phone" placeholder="رقم الهاتف أو مستطرق"><select id="colorMode"><option value="COLOR">ملون</option><option value="BW">أسود وأبيض</option></select><input id="copies" type="number" min="1" value="1" placeholder="عدد النسخ"><textarea id="notes" placeholder="ملاحظات"></textarea></div><button class="send" onclick="submitId()">إرسال الهوية بعد القص للمكتبة</button><div class="status" id="status"></div></section></main><script>
const states=[{label:'وجه الهوية'},{label:'ظهر الهوية'}];
function editor(s,i){return `<article class="card"><h2>${s.label}</h2><label class="pick">اختيار الصورة<input type="file" accept="image/*" onchange="loadImage(${i},this.files[0])"></label><div class="frame"><img id="img${i}" alt="${s.label}"></div><div class="controls">${[['zoom','تكبير',100,300,100],['x','أفقي',-100,100,0],['y','عمودي',-100,100,0],['rotate','دوران',-180,180,0],['brightness','إضاءة',60,160,100]].map(([k,l,min,max,val])=>`<label><span>${l}</span><input id="${k}${i}" type="range" min="${min}" max="${max}" value="${val}" oninput="render(${i})"><output id="${k}Out${i}">${val}</output></label>`).join('')}</div></article>`}
editors.innerHTML=states.map(editor).join('');
function loadImage(i,file){if(!file)return;states[i].file=file;const u=URL.createObjectURL(file);states[i].url=u;document.getElementById(`img${i}`).src=u;render(i)}
function val(k,i){return Number(document.getElementById(k+i).value)}
function render(i){['zoom','x','y','rotate','brightness'].forEach(k=>document.getElementById(`${k}Out${i}`).value=val(k,i));const img=document.getElementById(`img${i}`);img.style.transform=`translate(${val('x',i)/2}%,${val('y',i)/2}%) scale(${val('zoom',i)/100}) rotate(${val('rotate',i)}deg)`;img.style.filter=`brightness(${val('brightness',i)}%)`}
async function exportImage(i){const s=states[i];if(!s.url)throw new Error(`اختر صورة ${s.label}`);const image=new Image();image.src=s.url;await image.decode();const canvas=document.createElement('canvas');canvas.width=1284;canvas.height=810;const c=canvas.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,canvas.width,canvas.height);c.filter=`brightness(${val('brightness',i)}%)`;c.translate(canvas.width/2+val('x',i)*canvas.width/400,canvas.height/2+val('y',i)*canvas.height/400);c.rotate(val('rotate',i)*Math.PI/180);const scale=Math.max(canvas.width/image.width,canvas.height/image.height)*val('zoom',i)/100;c.drawImage(image,-image.width*scale/2,-image.height*scale/2,image.width*scale,image.height*scale);return new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.92))}
async function submitId(){try{status.textContent='جاري تجهيز الصور...';const [front,back]=await Promise.all([exportImage(0),exportImage(1)]);const fd=new FormData();fd.append('files',front,'id-front.jpg');fd.append('files',back,'id-back.jpg');fd.append('printType','ID_CARD');fd.append('studentName',studentName.value.trim()||'مستطرق');fd.append('phone',phone.value.trim()||'مستطرق');fd.append('colorMode',colorMode.value);fd.append('copies',copies.value||1);fd.append('notes',notes.value.trim());status.textContent='جاري الرفع...';const r=await fetch('/upload-student-file',{method:'POST',body:fd}),d=await r.json();if(!r.ok)throw new Error(d.error||d.message||'تعذر الرفع');status.textContent='✅ تم إرسال الهوية بعد القص بنجاح';alert('تم إرسال الهوية للمكتبة');}catch(e){status.textContent=`❌ ${e.message}`}}
</script><script src="/notifications.js"></script></body></html>
