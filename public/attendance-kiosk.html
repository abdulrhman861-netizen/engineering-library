<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رمز حضور المكتبة</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#eef5fb;color:#15314c}.card{max-width:580px;margin:5vh auto;background:#fff;border-radius:24px;padding:28px;text-align:center;box-shadow:0 12px 40px #0002}select,button{width:100%;padding:13px;margin:8px 0;border-radius:11px;border:1px solid #ccd8e5;font:inherit}button{background:#0759a5;color:#fff;font-weight:bold;cursor:pointer}#qr{width:280px;height:280px;margin:20px auto;display:grid;place-items:center}.timer{font-size:1.2rem;color:#b36d00;font-weight:bold}.muted{color:#687789}</style></head><body><main class="card"><h1>بصمة حضور المكتبة</h1><p class="muted">يعرض هذا الرمز داخل الفرع ويتغير تلقائياً. يجب على الموظف السماح بالموقع بعد مسحه.</p><select id="branch"></select><button onclick="start()">عرض رمز الفرع</button><h2 id="name"></h2><div id="qr"></div><div class="timer" id="timer"></div><p id="msg" class="muted"></p><a href="staff.html">العودة إلى بوابة الكادر</a></main><script>const token=localStorage.getItem('employeeToken');const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)};let interval=null,selected=0;async function load(){if(!token)return location.replace('/staff.html');const r=await api('/api/attendance/branches'),d=await r.json();branch.innerHTML=(d.branches||[]).map(x=>`<option value="${x.branch_id}">${x.branch_name}</option>`).join('')}async function refresh(){if(!selected)return;const r=await api(`/api/attendance/kiosk-token?branchId=${selected}`),d=await r.json();if(!r.ok){msg.textContent=d.error;return}const url=`${location.origin}/staff.html?attendanceToken=${encodeURIComponent(d.token)}`;qr.innerHTML='';new QRCode(qr,{text:url,width:280,height:280,correctLevel:QRCode.CorrectLevel.M});name.textContent=d.branch.branch_name;let left=d.expiresInSeconds;timer.textContent=`يتغير خلال ${left} ثانية`;clearInterval(interval);interval=setInterval(()=>{left--;timer.textContent=`يتغير خلال ${Math.max(0,left)} ثانية`;if(left<=1){clearInterval(interval);refresh()}},1000)}function start(){selected=Number(branch.value);refresh()}load();</script></body></html>
