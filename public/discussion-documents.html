<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مستندات المناقشة</title><style>body{font-family:Tahoma;margin:0;background:#eee}.toolbar{padding:12px;text-align:center;position:sticky;top:0;background:#17324d}.toolbar button{padding:10px 18px}.page{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:22mm;box-sizing:border-box;page-break-after:always}.logos{display:flex;justify-content:space-between;height:80px}.center{text-align:center}.line{line-height:2}.signs{display:flex;justify-content:space-between;margin-top:60px}.committee{width:100%;border-collapse:collapse}.committee td,.committee th{border:1px solid #333;padding:9px}@media print{body{background:#fff}.toolbar{display:none}.page{margin:0}}@media(max-width:800px){.page{width:100%;padding:20px}}</style></head><body><div class="toolbar"><button onclick="print()">طباعة المستندات</button></div><div id="pages"></div><script>const token=localStorage.getItem('employeeToken')||sessionStorage.getItem('adminToken'),id=new URLSearchParams(location.search).get('id'),esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));(async()=>{const r=await fetch(`/api/discussions/${id}/documents`,{headers:{Authorization:`Bearer ${token}`}}),x=await r.json();if(!r.ok){pages.textContent=x.error;return}const d=x.discussion,c=x.committee||[],rows=c.map(m=>`<tr><td>${esc(m.member_name)}</td><td>${esc(m.academic_title)}</td><td>${esc(m.workplace)}</td><td>${esc(m.role_in_committee)}</td></tr>`).join('');pages.innerHTML=`<section class="page"><div class="logos"><span>شعار الكلية</span><span>شعار الجامعة</span></div><h1 class="center">إقرار المشرف</h1><p class="line">أقر بأن الرسالة/الأطروحة الموسومة «${esc(d.thesis_title)}» والمقدمة من الطالب/ة ${esc(d.student_name)} قد أُنجزت بإشرافي، وهي مستوفية لمتطلبات المناقشة.</p><div class="signs"><b>المشرف: ${esc(d.supervisor_name||'................')}</b><b>التاريخ: ${esc(d.discussion_date)}</b></div></section><section class="page"><div class="logos"><span>شعار الكلية</span><span>شعار الجامعة</span></div><h1 class="center">إقرار لجنة المناقشة</h1><p class="line">نشهد بأننا ناقشنا الطالب/ة ${esc(d.student_name)} في ${esc(d.degree_type)} عن موضوع «${esc(d.thesis_title)}»، وقد أُجيزت الرسالة/الأطروحة وفق الضوابط النافذة.</p><table class="committee"><tr><th>الاسم</th><th>اللقب العلمي</th><th>مكان العمل</th><th>الصفة</th></tr>${rows}</table><div class="signs"><b>المعاون العلمي: ${esc(d.scientific_assistant_name||'........')}</b><b>العميد: ${esc(d.dean_name||'........')}</b></div></section><section class="page"><h1 class="center">أسماء أعضاء لجنة المناقشة</h1><table class="committee"><tr><th>ت</th><th>الاسم</th><th>اللقب العلمي</th><th>مكان العمل</th><th>الصفة</th></tr>${c.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m.member_name)}</td><td>${esc(m.academic_title)}</td><td>${esc(m.workplace)}</td><td>${esc(m.role_in_committee)}</td></tr>`).join('')}</table></section>`})()</script></body></html>
