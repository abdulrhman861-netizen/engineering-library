<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محادثات الطلاب</title><style>
body{font-family:Tahoma;background:#eef3f7}.wrap{max-width:1100px;margin:auto}.layout{display:grid;grid-template-columns:320px 1fr;gap:12px}.panel{background:white;padding:15px;border-radius:12px}.conv{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}.messages{height:480px;overflow:auto;background:#f7f9fb}.m{padding:9px;margin:7px;border-radius:9px}.STUDENT{background:#dcedff}.STAFF{background:#dcf5e6}input,button{padding:10px;margin:3px}button{background:#0759a5;color:white;border:0;border-radius:7px}@media(max-width:700px){.layout{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><h1>محادثات الطلاب</h1><p><a href="staff.html">بوابة الكادر</a></p><div class="layout"><section class="panel" id="conversations"></section><section class="panel"><div class="messages" id="messages">اختر محادثة</div><div><input id="text" placeholder="الرد"><input id="attachment" type="file"><button onclick="send()">إرسال</button><button onclick="toPrint()">تحويل آخر ملف للطباعة</button><button onclick="toTask()">إنشاء مهمة</button><button onclick="closeChat()">إغلاق المحادثة</button></div></section></div></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');let current=null;const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadConvs(){const r=await api('/api/staff/chats'),d=await r.json();conversations.innerHTML=d.conversations.map(x=>`<div class="conv" onclick="openConv(${x.conversation_id})"><b>${esc(x.student_name)}</b><br>${esc(x.phone)} — ${x.status==='OPEN'?'مفتوحة':'مغلقة'} (${x.message_count})</div>`).join('')}
async function openConv(id){current=id;const r=await api(`/api/staff/chats/${id}/messages`),d=await r.json();messages.innerHTML=d.messages.map(x=>`<div class="m ${x.sender_type}">${esc(x.message_text||'')}${x.attachment_path?`<div><a href="${x.attachment_path}" target="_blank">📎 ${esc(x.attachment_name)}</a></div>`:''}</div>`).join('');messages.scrollTop=messages.scrollHeight}
async function send(){if(!current)return alert('اختر محادثة أولاً');const fd=new FormData();fd.append('message',text.value);if(attachment.files[0])fd.append('attachment',attachment.files[0]);const r=await api(`/api/staff/chats/${current}/messages`,{method:'POST',body:fd});if(!r.ok)return alert((await r.json()).error);text.value='';attachment.value='';openConv(current)}
async function action(path,ok){if(!current)return alert('اختر محادثة أولاً');const r=await api(`/api/staff/chats/${current}/${path}`,{method:'POST'}),d=await r.json();alert(r.ok?ok:(d.error||'تعذر تنفيذ العملية'))}async function toPrint(){action('to-print','تم إرسال آخر ملف مرفق إلى قائمة الطباعة')}async function toTask(){action('to-task','تم إنشاء مهمة من المحادثة')}async function closeChat(){if(!current)return;await api(`/api/staff/chats/${current}/close`,{method:'PATCH'});loadConvs()}loadConvs();setInterval(()=>{loadConvs();if(current)openConv(current)},10000);
</script></body></html>
