<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محادثات الطلاب</title><style>body{font-family:Tahoma;background:#eef3f7}.wrap{max-width:1100px;margin:auto}.layout{display:grid;grid-template-columns:320px 1fr;gap:12px}.panel{background:#fff;padding:15px;border-radius:12px}.conv{padding:10px;border-bottom:1px solid #ddd;cursor:pointer}.messages{height:480px;overflow:auto;background:#f7f9fb}.m{padding:9px;margin:7px;border-radius:9px}.STUDENT{background:#dcedff}.STAFF{background:#dcf5e6}input,button{padding:10px;margin:3px}button{background:#0759a5;color:white}@media(max-width:700px){.layout{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>محادثات الطلاب <span id="badge"></span></h1><a href="staff.html">بوابة الكادر</a><div class="layout"><section class="panel" id="conversations"></section><section class="panel"><div class="messages" id="messages">اختر محادثة</div><input id="text" placeholder="الرد"><input id="attachment" type="file" accept=".pdf,.doc,.docx,image/*,audio/*"><button onclick="send()">إرسال</button><button id="voiceBtn" onclick="voice()">🎙️ صوت</button><button onclick="action('to-print','تم التحويل للطباعة')">تحويل للطباعة</button><button onclick="action('to-task','تم إنشاء مهمة')">إنشاء مهمة</button><button onclick="closeChat()">إنهاء المحادثة</button></section></div></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');let current=null,totalUnread=0,recorder,chunks=[];const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)},esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));const stateName={OPEN:'مفتوحة',CLAIMED:'مستلمة',WAITING_STUDENT:'بانتظار الطالب',CLOSED:'منتهية'};async function loadConvs(){const r=await api('/api/staff/chats'),d=await r.json(),n=d.conversations.reduce((s,x)=>s+Number(x.unread_count||0),0);totalUnread=n;badge.textContent=`(${n} غير مقروءة)`;conversations.innerHTML=d.conversations.map(x=>`<div class="conv" onclick="openConv(${x.conversation_id})"><b>${esc(x.student_name)}</b>${Number(x.unread_count)?` <strong style="color:#c22">(${x.unread_count} جديد)</strong>`:''}<br>${esc(x.phone)} — ${stateName[x.status]||x.status}${x.claimed_by_name?`<br>استلمها: ${esc(x.claimed_by_name)}`:''}<br><button onclick="event.stopPropagation();claimChat(${x.conversation_id})">استلام المحادثة</button></div>`).join('')}async function claimChat(id){const r=await api(`/api/staff/chats/${id}/claim`,{method:'PATCH'}),d=await r.json();if(!r.ok)alert(d.error);else{current=id;loadConvs();openConv(id)}}async function openConv(id){current=id;const r=await api(`/api/staff/chats/${id}/messages`),d=await r.json();messages.innerHTML=d.messages.map(x=>`<div class="m ${x.sender_type}"><b>${esc(x.sender_name)}</b><br>${esc(x.message_text||'')}${x.attachment_path?(x.attachment_path.match(/\.(webm|m4a|mp3|ogg|wav)(\?|$)/i)?`<audio controls src="${x.attachment_path}"></audio>`:`<a target="_blank" href="${x.attachment_path}"> 📎 ${esc(x.attachment_name)}</a>`):''}<small> — ${new Date(x.created_at).toLocaleString('ar-IQ')}</small></div>`).join('');messages.scrollTop=messages.scrollHeight}async function send(){if(!current)return alert('اختر محادثة');const fd=new FormData();fd.append('message',text.value);if(attachment.files[0])fd.append('attachment',attachment.files[0]);const r=await api(`/api/staff/chats/${current}/messages`,{method:'POST',body:fd});if(!r.ok)return alert((await r.json()).error);text.value='';attachment.value='';openConv(current);loadConvs()}async function action(p,msg){if(!current)return;const r=await api(`/api/staff/chats/${current}/${p}`,{method:'POST'}),d=await r.json();alert(r.ok?msg:d.error)}async function closeChat(){if(!current)return;if(!confirm('إنهاء هذه المحادثة؟'))return;await api(`/api/staff/chats/${current}/close`,{method:'PATCH'});current=null;messages.textContent='اختر محادثة';loadConvs()}async function voice(){if(!recorder){const s=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(s);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const dt=new DataTransfer(),blob=new Blob(chunks,{type:'audio/webm'});dt.items.add(new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'}));attachment.files=dt.files;chunks=[];voiceBtn.textContent='🎙️ صوت'};recorder.start();voiceBtn.textContent='⏹ إيقاف'}else{recorder.stop();recorder=null}}loadConvs();setInterval(()=>{loadConvs();if(current)openConv(current)},10000);
</script><script src="/staff-chat-alerts.js"></script><script src="/staff-nav.js"></script></body></html>
