<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طباعة الهويات A4</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;margin:0;background:#e9eef3}.bar{background:#fff;padding:12px;text-align:center;position:sticky;top:0}.bar button{background:#087f5b;color:#fff;border:0;border-radius:9px;padding:12px 24px;font-weight:bold;cursor:pointer}.sheet{width:210mm;min-height:297mm;margin:10px auto;background:#fff;padding:12mm 10mm;display:grid;grid-template-columns:90mm 90mm;grid-auto-rows:60mm;gap:5mm 8mm;align-content:start;justify-content:center}.id-img{width:90mm;height:60mm;object-fit:contain;border:0}.error{text-align:center;padding:40px}@media print{body{background:#fff}.bar{display:none}.sheet{margin:0}@page{size:A4 portrait;margin:0}}
</style></head><body><div class="bar"><button onclick="window.print()">فتح إعدادات الطابعة</button></div><main class="sheet" id="sheet"></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');const ids=(new URLSearchParams(location.search).get('ids')||'').split(',').filter(x=>/^\d+$/.test(x)).slice(0,4);Promise.all(ids.map(id=>fetch(`/api/student-files/${id}`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>{if(!r.ok)throw new Error();return r.json()}))).then(items=>{const sheet=document.getElementById('sheet');for(const f of items){const front=document.createElement('img'),back=document.createElement('img');front.className=back.className='id-img';front.src=f.url;back.src=f.secondUrl;sheet.append(front,back)}}).catch(()=>document.body.innerHTML='<p class="error">تعذر تجهيز الهويات للطباعة</p>');
</script></body></html>
