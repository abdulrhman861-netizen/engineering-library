<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مهام الكادر</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;font-family:Tahoma,Arial;color:#172033}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top a{background:#18324e;color:#fff;padding:10px 15px;border-radius:10px;text-decoration:none}.panel{background:#fff;border-radius:16px;padding:20px;margin:18px 0;box-shadow:0 5px 20px #0000000d}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.field label{display:block;font-weight:bold;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d7dee8;border-radius:9px;font:inherit}.types{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}.types label{background:#edf3f9;padding:9px 12px;border-radius:9px}.primary,.claim,.complete,.pay,.printq{border:0;color:#fff;padding:10px 14px;border-radius:9px;font-weight:bold;cursor:pointer}.primary{background:#0759a5}.claim{background:#168a51}.complete{background:#0759a5}.pay{background:#8a4ca4}.printq{background:#e06d00}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}.task{background:#fff;border-radius:14px;padding:17px;border-right:6px solid #e3a008;box-shadow:0 5px 18px #0000000b}.task.mine{border-color:#1577c8}.task.old{background:#fff2f0;border-color:#d9363e}.meta{color:#59677a;margin:7px 0;font-size:.92rem}.badge{display:inline-block;padding:5px 9px;border-radius:15px;background:#fff0c2;color:#714f00;font-weight:bold}.mine .badge{background:#dff0ff;color:#0759a5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.empty{text-align:center;padding:35px;color:#667085}.msg{font-weight:bold;margin-top:10px}
</style></head><body><main class="wrap"><header class="top"><div><h1>قائمة مهام الكادر</h1><div id="who"></div></div><a href="staff.html">العودة إلى بوابة الكادر</a></header>
<section class="panel"><h2>إضافة طلب جديد كمهام منفصلة</h2><div class="formgrid"><div class="field"><label>اسم الطالب *</label><input id="customerName" placeholder="الاسم أو مستطرق"></div><div class="field"><label>رقم الهاتف *</label><input id="customerPhone" placeholder="07... أو مستطرق"></div><div class="field"><label>المبلغ الكلي</label><input id="amountTotal" type="number" min="0" value="0"></div><div class="field"><label>المبلغ المدفوع</label><input id="amountPaid" type="number" min="0" value="0"></div><div class="field"><label>موعد الإنجاز</label><input id="dueAt" type="datetime-local"></div><div class="field"><label>ملاحظات</label><input id="notes" placeholder="المبلغ المتبقي أو تفاصيل الطلب"></div><div class="field"><label>ملفات المهمة (حتى 10)</label><input id="attachment" type="file" multiple accept=".pdf,.doc,.docx,image/*"><small>يمكن تحديد عدة صور أو ملفات معاً</small></div></div>
<div class="types" id="types"><label><input type="checkbox" value="طباعة"> طباعة</label><label><input type="checkbox" value="تنضيد"> تنضيد</label><label><input type="checkbox" value="استنساخ"> استنساخ</label><label><input type="checkbox" value="تجليد"> تجليد</label><label><input type="checkbox" value="توزيع"> توزيع</label><label><input type="checkbox" value="تصميم"> تصميم</label><label><input type="checkbox" value="أخرى"> أخرى</label></div><button class="primary" onclick="createTasks()">إضافة المهام</button><div class="msg" id="msg"></div></section>
<section><div class="top"><h2>المهام المتاحة وقيد الإنجاز</h2><button class="primary" onclick="loadTasks()">تحديث</button></div><div class="grid" id="list"><div class="empty">جاري التحميل...</div></div></section></main><script>
const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));who.textContent='الموظف: '+(localStorage.getItem('employeeName')||'');
async function createTasks(){const types=[...document.querySelectorAll('#types input:checked')].map(x=>x.value);if(!customerName.value.trim()||!customerPhone.value.trim()||!types.length)return alert('أدخل اسم الطالب ورقم الهاتف وحدد مهمة واحدة على الأقل');if(attachment.files.length>10)return alert('الحد الأعلى 10 ملفات');const fd=new FormData();fd.append('customerName',customerName.value.trim());fd.append('customerPhone',customerPhone.value.trim());fd.append('amountTotal',amountTotal.value);fd.append('amountPaid',amountPaid.value);fd.append('dueAt',dueAt.value||'');fd.append('notes',notes.value.trim());types.forEach(x=>fd.append('types[]',x));[...attachment.files].forEach(f=>fd.append('attachments',f));const r=await api('/api/work-tasks/batch',{method:'POST',body:fd}),d=await r.json();msg.textContent=d.message||d.error||'';msg.style.color=r.ok?'green':'#c33';if(r.ok){document.querySelectorAll('#types input').forEach(x=>x.checked=false);attachment.value='';loadTasks()}}
async function loadTasks(){const r=await api('/api/work-tasks');if(r.status===401)return location.replace('/staff.html');const d=await r.json(),tasks=d.tasks||[];list.innerHTML=tasks.length?tasks.map(t=>{const old=Number(t.age_hours)>24&&t.status==='PENDING',files=Array.isArray(t.attachments)?t.attachments:[];return `<article class="task ${t.is_mine?'mine':''} ${old?'old':''}"><h3>${esc(t.title)}</h3><span class="badge">${t.status==='PENDING'?'متاحة':'قيد الإنجاز'}</span>${old?'<b style="color:#c22"> — معلقة أكثر من 24 ساعة</b>':''}<div class="meta">الطالب: <b>${esc(t.customer_name||'-')}</b> — ${esc(t.customer_phone||'-')}</div><div class="meta">أنشأها: ${esc(t.created_by_name||'غير محدد')} ${t.assigned_to_name?'— استلمها: '+esc(t.assigned_to_name):''}</div><div class="meta">المبلغ: ${Number(t.amount_total||0).toLocaleString()} — المدفوع: ${Number(t.amount_paid||0).toLocaleString()} — المتبقي: <b>${Number(t.balance||0).toLocaleString()}</b></div>${t.notes?`<div class="meta">ملاحظات: ${esc(t.notes)}</div>`:''}${files.map(f=>`<div class="meta"><a href="${f.url}" target="_blank" download>📎 ${esc(f.name)}</a></div>`).join('')}<div class="actions">${t.status==='PENDING'?`<button class="claim" onclick="act(${t.task_id},'claim')">استلام المهمة</button>`:''}${t.is_mine?`<button class="complete" onclick="act(${t.task_id},'complete')">تم الإنجاز</button><button class="pay" onclick="payment(${t.task_id},${Number(t.amount_total||0)},${Number(t.amount_paid||0)})">تحديث الدفع</button>`:''}${files.length?`<button class="printq" onclick="toPrint(${t.task_id})">تحويل ${files.length} ملف للطباعة</button>`:''}</div></article>`}).join(''):'<div class="panel empty">لا توجد مهام معلقة حالياً</div>'}
async function act(id,a){const r=await api(`/api/work-tasks/${id}/${a}`,{method:'PATCH'}),d=await r.json();if(!r.ok)alert(d.error||'تعذر تنفيذ العملية');loadTasks()}
async function payment(id,total,current){const paid=prompt(`المبلغ الكلي ${total}\nأدخل مجموع ما دفعه الطالب:`,current);if(paid===null)return;const note=prompt('ملاحظة الدفع (اختياري):','')||'';const r=await api(`/api/work-tasks/${id}/payment`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({amountPaid:Number(paid),note})}),d=await r.json();if(!r.ok)alert(d.error||'تعذر التحديث');loadTasks()}
async function toPrint(id){const colorMode=confirm('موافق: ملون — إلغاء: أسود وأبيض')?'COLOR':'BW';const copies=Math.max(1,Number(prompt('عدد النسخ لكل ملف:',1)||1));const duplexMode=confirm('هل تريد الطباعة على الوجهين؟')?'DUPLEX_LONG':'SIMPLEX';const r=await api(`/api/work-tasks/${id}/to-print`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({colorMode,copies,paperSize:'A4',duplexMode})}),d=await r.json();alert(d.message||d.error||'تمت العملية')}
loadTasks();setInterval(loadTasks,20000);
</script><script src="/staff-chat-alerts.js"></script></body></html>
