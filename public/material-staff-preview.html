<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الملزمة</title><style>body{font-family:Tahoma;background:#eef2f6;margin:0}.top{position:sticky;top:0;background:#14233b;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:5}button,a{background:#087f5b;color:#fff;border:0;border-radius:8px;padding:10px 16px;text-decoration:none;cursor:pointer}.card{max-width:950px;margin:20px auto;background:#fff;padding:18px;border-radius:15px;text-align:center}.viewer{width:100%;height:75vh;border:1px solid #ccd5df}.image{max-width:100%;max-height:75vh;object-fit:contain}</style></head><body><header class="top"><b id="title">معاينة الملزمة</b><button id="printBtn">فتح نافذة الطباعة</button><button onclick="close()">إغلاق</button></header><main class="card" id="content">جاري التحميل...</main><script>
const token=localStorage.getItem('employeeToken'),p=new URLSearchParams(location.search),id=p.get('id');if(!token)location.replace('/staff.html');let fileUrl='';(async()=>{const r=await fetch(`/api/staff/materials/${id}`,{headers:{Authorization:`Bearer ${token}`}}),d=await r.json();if(!r.ok){content.textContent=d.error||'تعذر فتح الملزمة';return}const m=d.material;title.textContent=`${m.title} — ${m.doctor_name||''}`;fileUrl=m.file_path;const type=String(m.mime_type||''),isImage=type.startsWith('image/')||/\.(png|jpe?g|webp)(\?|$)/i.test(fileUrl),isPdf=type.includes('pdf')||/\.pdf(\?|$)/i.test(fileUrl);content.innerHTML=isImage?`<img class="image" src="${fileUrl}">`:isPdf?`<iframe class="viewer" src="${fileUrl}#toolbar=1"></iframe>`:'<p>ملف Word — افتحه في البرنامج المناسب ثم اطبعه.</p>';if(p.get('print')==='1')setTimeout(()=>window.open(fileUrl,'_blank'),600)})();printBtn.onclick=()=>fileUrl&&window.open(fileUrl,'_blank');
</script></body></html>
