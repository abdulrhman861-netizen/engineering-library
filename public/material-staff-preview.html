<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معاينة الملزمة</title><style>body{font-family:Tahoma;background:#eef2f6;margin:0}.top{position:sticky;top:0;background:#14233b;color:#fff;padding:12px;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;z-index:5}button,a{background:#087f5b;color:#fff;border:0;border-radius:8px;padding:10px 16px;text-decoration:none;cursor:pointer}.download{background:#536579}.card{max-width:1000px;margin:20px auto;background:#fff;padding:18px;border-radius:15px;text-align:center}.viewer{width:100%;height:78vh;border:1px solid #ccd5df}.image{max-width:100%;max-height:78vh;object-fit:contain}.note{background:#fff3cd;padding:12px;border-radius:9px;margin-bottom:10px}</style></head><body><header class="top"><b id="title">معاينة الملزمة</b><button id="printBtn">فتح الطباعة التقليدية</button><a id="downloadBtn" class="download" target="_blank">فتح/تنزيل الملف الأصلي</a><button onclick="close()">إغلاق</button></header><main class="card" id="content">جاري التحميل...</main><script>
const token=localStorage.getItem('employeeToken'),p=new URLSearchParams(location.search),id=p.get('id');if(!token)location.replace('/staff.html');let fileUrl='';
(async()=>{const r=await fetch(`/api/staff/materials/${id}`,{headers:{Authorization:`Bearer ${token}`}}),d=await r.json();if(!r.ok){content.textContent=d.error||'تعذر فتح الملزمة';return}const m=d.material;title.textContent=`${m.title} — ${m.doctor_name||''}`;fileUrl=m.file_path;downloadBtn.href=fileUrl;const type=String(m.mime_type||''),isImage=type.startsWith('image/')||/\.(png|jpe?g|webp)(\?|$)/i.test(fileUrl),isPdf=type.includes('pdf')||/\.pdf(\?|$)/i.test(fileUrl),isWord=type.includes('word')||type.includes('msword')||/\.docx?(\?|$)/i.test(fileUrl);if(isImage)content.innerHTML=`<img class="image" src="${fileUrl}">`;else if(isPdf)content.innerHTML=`<iframe class="viewer" src="${fileUrl}#toolbar=1"></iframe>`;else if(isWord){const viewer=`https://view.officeapps.live.com/op/embed.aspx?src=${encodeURIComponent(fileUrl)}`;content.innerHTML=`<p class="note">معاينة Word بواسطة عارض Microsoft. إذا لم تظهر، استخدم زر فتح/تنزيل الملف الأصلي.</p><iframe class="viewer" src="${viewer}" allowfullscreen></iframe>`}else content.innerHTML='<p>لا تتوفر معاينة لهذا النوع.</p>';if(p.get('print')==='1')setTimeout(()=>window.open(fileUrl,'_blank'),600)})();
printBtn.onclick=()=>fileUrl&&window.open(fileUrl,'_blank');
</script></body></html>
