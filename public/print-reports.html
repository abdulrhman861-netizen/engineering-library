<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير صفحات الطباعة</title><style>
*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#eef3f7;margin:0;color:#172033}.wrap{max-width:1050px;margin:auto;padding:22px}.top,.filters,.totals,.panel{background:#fff;padding:16px;border-radius:14px;margin-bottom:14px;box-shadow:0 4px 16px #0001}.top{display:flex;justify-content:space-between;align-items:center}.top a,button{background:#0759a5;color:#fff;border:0;border-radius:9px;padding:10px 15px;text-decoration:none;cursor:pointer}.filters{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.filters label{display:grid;gap:6px}.filters input{padding:10px;border:1px solid #ccd5df;border-radius:8px}.totals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:16px;border-radius:12px;background:#edf5ff;text-align:center}.stat b{display:block;font-size:1.7rem;color:#0759a5}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #e1e6ec;text-align:center}@media(max-width:650px){.totals{grid-template-columns:1fr 1fr}.panel{overflow:auto}}
</style></head><body><main class="wrap"><header class="top"><h1>تقرير صفحات الطباعة المباشرة</h1><a href="admin.html">لوحة المدير</a></header><section class="filters"><label>من<input id="from" type="date"></label><label>إلى<input id="to" type="date"></label><button onclick="load()">عرض التقرير</button></section><section class="totals"><div class="stat"><b id="jobs">0</b>طلبات</div><div class="stat"><b id="pages">0</b>مجموع الصفحات</div><div class="stat"><b id="bw">0</b>أسود وأبيض</div><div class="stat"><b id="color">0</b>ملون</div></section><section class="panel"><table><thead><tr><th>اليوم</th><th>الطلبات</th><th>الصفحات</th><th>أسود وأبيض</th><th>ملون</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>
const token=sessionStorage.getItem('adminToken');if(!token)location.replace('/admin.html');const now=new Date(),before=new Date(Date.now()-30*86400000);to.value=now.toISOString().slice(0,10);from.value=before.toISOString().slice(0,10);
async function load(){const r=await fetch(`/api/admin/print-stats?from=${from.value}&to=${to.value}`,{headers:{Authorization:`Bearer ${token}`}}),d=await r.json();if(r.status===401||r.status===403)return location.replace('/admin.html');if(!r.ok)return alert(d.error||'تعذر تحميل التقرير');jobs.textContent=d.totals.jobs;pages.textContent=d.totals.pages;bw.textContent=d.totals.bw;color.textContent=d.totals.color;rows.innerHTML=d.days.length?d.days.map(x=>`<tr><td>${new Date(x.day).toLocaleDateString('ar-IQ')}</td><td>${x.jobs}</td><td>${x.total_pages}</td><td>${x.bw_pages}</td><td>${x.color_pages}</td></tr>`).join(''):'<tr><td colspan="5">لا توجد طباعات مكتملة في المدة المحددة</td></tr>'}load();
</script></body></html>
