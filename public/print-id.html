<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طباعة الهوية</title>
<style>*{box-sizing:border-box}body{font-family:Tahoma,Arial;margin:0;background:#eef2f6;color:#17202a}.bar{padding:14px;text-align:center;background:#fff;box-shadow:0 2px 8px #0001}.bar button{background:#087f5b;color:#fff;border:0;padding:12px 24px;border-radius:9px;font-weight:bold;cursor:pointer}.sheet{width:210mm;min-height:297mm;margin:12px auto;background:#fff;padding:20mm;display:flex;align-items:flex-start;justify-content:center;gap:10mm}.card{width:85.6mm;height:54mm;object-fit:contain;border:1px solid #ddd}@media print{body{background:#fff}.bar{display:none}.sheet{margin:0;padding:20mm;box-shadow:none}@page{size:A4 portrait;margin:0}}</style></head>
<body><div class="bar"><button onclick="window.print()">طباعة الوجه والظهر</button></div><main class="sheet"><img id="front" class="card" alt="وجه الهوية"><img id="back" class="card" alt="ظهر الهوية"></main>
<script>const token=localStorage.getItem('employeeToken');if(!token)location.replace('/staff.html');const id=new URLSearchParams(location.search).get('id');fetch(`/api/student-files/${id}`,{headers:{Authorization:`Bearer ${token}`}}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(f=>{document.getElementById('front').src=f.url;document.getElementById('back').src=f.secondUrl}).catch(()=>document.body.innerHTML='<p style="text-align:center">تعذر فتح طلب الهوية</p>');</script></body></html>
