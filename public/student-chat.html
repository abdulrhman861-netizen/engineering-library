<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دردشة المكتبة</title><style>body{font-family:Tahoma;background:#eef3f7;margin:0}.box{max-width:700px;margin:25px auto;background:white;padding:20px;border-radius:15px}.messages{height:430px;overflow:auto;background:#f7f9fb;padding:12px;border-radius:10px}.m{padding:9px;margin:7px;border-radius:10px;max-width:80%}.STUDENT{background:#dcedff;margin-right:auto}.STAFF{background:#dcf5e6;margin-left:auto}input,button{padding:11px;border-radius:8px;border:1px solid #ccd5df}button{background:#0759a5;color:white}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.row input[type=text]{flex:1}</style></head><body><div class="box"><h1>الدردشة مع المكتبة</h1><div id="start"><input id="studentName" placeholder="اسم الطالب"><input id="phone" placeholder="رقم الهاتف"><button onclick="startChat()">بدء المحادثة</button></div><div id="chat" style="display:none"><div class="messages" id="messages"></div><div class="row"><input id="text" type="text" placeholder="اكتب رسالتك"><input id="attachment" type="file" accept=".pdf,.doc,.docx,image/*"><button onclick="send()">إرسال</button></div></div><p><a href="/">الرئيسية</a></p></div><script>
let token=localStorage.getItem('studentChatToken');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function startChat(){const r=await fetch('/api/chat/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentName:studentName.value,phone:phone.value})}),d=await r.json();if(!r.ok)return alert(d.error);token=d.public_token;localStorage.setItem('studentChatToken',token);openChat()}function openChat(){start.style.display='none';chat.style.display='block';load()}async function load(){const r=await fetch(`/api/chat/${token}/messages`);if(!r.ok){localStorage.removeItem('studentChatToken');return location.reload()}const d=await r.json();messages.innerHTML=d.messages.map(x=>`<div class="m ${x.sender_type}">${esc(x.message_text||'')}${x.attachment_path?`<div><a href="${x.attachment_path}" target="_blank">📎 ${esc(x.attachment_name)}</a></div>`:''}</div>`).join('');messages.scrollTop=messages.scrollHeight}async function send(){const fd=new FormData();fd.append('message',text.value);if(attachment.files[0])fd.append('attachment',attachment.files[0]);const r=await fetch(`/api/chat/${token}/messages`,{method:'POST',body:fd}),d=await r.json();if(!r.ok)return alert(d.error);text.value='';attachment.value='';load()}if(token)openChat();setInterval(()=>token&&load(),8000);
</script></body></html>
