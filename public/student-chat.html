<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>دردشة المكتبة</title><style>body{font-family:Tahoma;background:#eef3f7}.box{max-width:700px;margin:25px auto;background:#fff;padding:20px;border-radius:15px}.messages{height:430px;overflow:auto;background:#f7f9fb;padding:12px}.m{padding:9px;margin:7px;border-radius:10px}.STUDENT{background:#dcedff}.STAFF{background:#dcf5e6}input,button{padding:11px;margin:4px}button{background:#0759a5;color:#fff}</style></head><body><main class="box"><h1>الدردشة مع المكتبة</h1><div id="start"><input id="studentName" placeholder="اسم الطالب"><input id="phone" placeholder="رقم الهاتف"><button onclick="startChat()">بدء المحادثة</button></div><div id="chat" hidden><div class="messages" id="messages"></div><input id="text" placeholder="اكتب رسالتك"><input id="attachment" type="file" accept=".pdf,.doc,.docx,image/*,audio/*"><button onclick="send()">إرسال</button><button id="voiceBtn" onclick="voice()">🎙️ تسجيل صوتي</button><p id="closed"></p></div><a href="/students.html">بوابة الطلاب</a></main><script>
let token=localStorage.getItem('studentChatToken'),recorder,chunks=[];const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));async function startChat(){const r=await fetch('/api/chat/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({studentName:studentName.value,phone:phone.value})}),d=await r.json();if(!r.ok)return alert(d.error);token=d.public_token;localStorage.setItem('studentChatToken',token);openChat()}function openChat(){start.hidden=true;chat.hidden=false;load()}async function load(){const r=await fetch(`/api/chat/${token}/messages`);if(!r.ok){localStorage.removeItem('studentChatToken');return}const d=await r.json();closed.textContent=d.conversation.status==='CLOSED'?'تم إنهاء هذه المحادثة من كادر المكتبة':'';messages.innerHTML=d.messages.map(x=>`<div class="m ${x.sender_type}"><b>${esc(x.sender_name)}</b><br>${esc(x.message_text||'')}${x.attachment_path?(x.attachment_path.match(/\.(webm|m4a|mp3|ogg|wav)(\?|$)/i)?`<audio controls src="${x.attachment_path}"></audio>`:`<a target="_blank" href="${x.attachment_path}"> 📎 ${esc(x.attachment_name)}</a>`):''}</div>`).join('')}async function send(){const fd=new FormData();fd.append('message',text.value);if(attachment.files[0])fd.append('attachment',attachment.files[0]);const r=await fetch(`/api/chat/${token}/messages`,{method:'POST',body:fd}),d=await r.json();if(!r.ok)return alert(d.error);text.value='';attachment.value='';load()}async function voice(){if(!recorder){const stream=await navigator.mediaDevices.getUserMedia({audio:true});recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>chunks.push(e.data);recorder.onstop=()=>{const dt=new DataTransfer(),blob=new Blob(chunks,{type:'audio/webm'});dt.items.add(new File([blob],`voice-${Date.now()}.webm`,{type:'audio/webm'}));attachment.files=dt.files;chunks=[];voiceBtn.textContent='🎙️ تسجيل صوتي'};recorder.start();voiceBtn.textContent='⏹ إيقاف'}else{recorder.stop();recorder=null}}if(token)openChat();setInterval(()=>token&&load(),8000);
</script></body></html>
