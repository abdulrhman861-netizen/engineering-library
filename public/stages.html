<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المراحل الدراسية</title><link rel="manifest" href="/manifest.json"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><style>
:root{--blue:#0759a5}*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f4f7fa;margin:0;color:#172033}.wrap{max-width:950px;margin:auto;padding:32px 18px}.top{display:flex;justify-content:space-between;align-items:center}.back{background:#5b6470;color:#fff;padding:10px 18px;border-radius:10px;text-decoration:none}h1{text-align:center;color:var(--blue);margin:40px 0 25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:#fff;border:1px solid #e7ebef;border-radius:18px;padding:32px 16px;text-align:center;box-shadow:0 8px 24px #0000000d;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-4px);border-color:var(--blue)}.card i{font-size:35px;color:var(--blue);display:block;margin-bottom:14px}.card strong{font-size:19px}@media(max-width:540px){.grid{grid-template-columns:1fr 1fr}.card{padding:24px 8px}.card strong{font-size:15px}}
</style></head><body><main class="wrap"><div class="top"><a class="back" href="index.html"><i class="fa fa-arrow-right"></i> الرئيسية</a></div><h1 id="title">مراحل القسم</h1><section class="grid" id="grid"></section></main><script>
const p=new URLSearchParams(location.search),dept=p.get('dept')||'computer',name=p.get('name')||'القسم';document.getElementById('title').textContent=`مراحل ${name}`;
const defaults=[{code:'1',name:'المرحلة الأولى'},{code:'2',name:'المرحلة الثانية'},{code:'3',name:'المرحلة الثالثة'},{code:'4',name:'المرحلة الرابعة'},{code:'masters',name:'الماجستير'},{code:'phd',name:'الدكتوراه'}];
async function render(){let stages=defaults;try{const r=await fetch('/api/stages');if(r.ok)stages=await r.json()}catch{}document.getElementById('grid').innerHTML=stages.map(s=>`<article class="card" onclick="location.href='files.html?dept=${encodeURIComponent(dept)}&stage=${encodeURIComponent(s.code)}&stageName=${encodeURIComponent(s.name)}'"><i class="fa-solid fa-graduation-cap"></i><strong>${s.name}</strong></article>`).join('')}render();
</script></body></html>
