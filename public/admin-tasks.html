<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>أرشيف المهام والديون</title><style>*{box-sizing:border-box}body{font-family:Tahoma,Arial;background:#f3f6fa;margin:0;color:#172033}.wrap{max-width:1300px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.top a,.btn{background:#18324e;color:#fff;border:0;padding:10px 14px;border-radius:9px;text-decoration:none;cursor:pointer}.panel{background:#fff;padding:20px;border-radius:15px;margin:16px 0;box-shadow:0 5px 18px #0000000d}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{padding:18px;border-radius:13px;background:#edf4fb;text-align:center}.stat b{display:block;font-size:1.5rem;margin-top:8px}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:10px;border-bottom:1px solid #e3e8ef;text-align:center}th{background:#172033;color:#fff}.table{overflow:auto}.pending{background:#fff2f0}.completed{color:#16724a;font-weight:bold}.debt{color:#c22;font-weight:bold}</style></head><body><main class="wrap"><header class="top"><h1>أرشيف المهام والديون</h1><div><button class="btn" onclick="loadAll()">تحديث</button> <a href="admin.html">لوحة المدير</a></div></header><section class="stats"><div class="stat">المهام المعلقة<b id="pending">0</b></div><div class="stat">قيد الإنجاز<b id="progress">0</b></div><div class="stat">المهام المنجزة<b id="completed">0</b></div><div class="stat">إجمالي المتبقي<b id="debtTotal">0</b></div></section><section class="panel"><h2>قائمة الديون والمبالغ المتبقية</h2><div class="table"><table><thead><tr><th>الطالب</th><th>الهاتف</th><th>عدد المهام</th><th>المبلغ المتبقي</th></tr></thead><tbody id="debts"></tbody></table></div></section><section class="panel"><h2>كل المهام والأرشيف</h2><div class="table"><table><thead><tr><th>المهمة</th><th>الطالب</th><th>الهاتف</th><th>الحالة</th><th>المنشئ</th><th>المستلم</th><th>المنجز</th><th>الكلي</th><th>المدفوع</th><th>المتبقي</th><th>التاريخ</th></tr></thead><tbody id="tasks"></tbody></table></div></section></main><script>
const token=sessionStorage.getItem('adminToken');if(!token)location.replace('/admin.html');const api=(u,o={})=>{o.headers=new Headers(o.headers||{});o.headers.set('Authorization',`Bearer ${token}`);return fetch(u,o)};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function loadAll(){const [tr,dr]=await Promise.all([api('/api/admin/work-tasks'),api('/api/admin/debts')]);if(tr.status===401||tr.status===403)return location.replace('/admin.html');const td=await tr.json(),dd=await dr.json(),a=td.tasks||[],ds=dd.debts||[];pending.textContent=a.filter(x=>x.status==='PENDING').length;progress.textContent=a.filter(x=>x.status==='IN_PROGRESS').length;completed.textContent=a.filter(x=>x.status==='COMPLETED').length;debtTotal.textContent=ds.reduce((n,x)=>n+Number(x.balance||0),0).toLocaleString();debts.innerHTML=ds.length?ds.map(x=>`<tr><td>${esc(x.customer_name)}</td><td>${esc(x.customer_phone)}</td><td>${x.task_count}</td><td class="debt">${Number(x.balance).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="4">لا توجد ديون</td></tr>';tasks.innerHTML=a.length?a.map(x=>`<tr class="${x.status==='PENDING'?'pending':''}"><td>${esc(x.title)}</td><td>${esc(x.customer_name||'-')}</td><td>${esc(x.customer_phone||'-')}</td><td class="${x.status==='COMPLETED'?'completed':''}">${x.status}</td><td>${esc(x.created_by_name||'-')}</td><td>${esc(x.assigned_to_name||'-')}</td><td>${esc(x.completed_by_name||'-')}</td><td>${Number(x.amount_total||0).toLocaleString()}</td><td>${Number(x.amount_paid||0).toLocaleString()}</td><td class="debt">${Number(x.balance||0).toLocaleString()}</td><td>${new Date(x.created_at).toLocaleString('ar-IQ')}</td></tr>`).join(''):'<tr><td colspan="11">لا توجد مهام</td></tr>'}
loadAll();
</script></body></html>
