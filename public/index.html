<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <!-- ربط الـ PWA والأيقونات -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#004a99">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="المكتبة الرقمية">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام مكتبة الهندسة - الجامعة العراقية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary-color: #004a99; --secondary-color: #27ae60; --bg-color: #f8f9fa; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: radial-gradient(circle at 50% 0,#e8f5ff 0,#f8f9fa 38%); margin: 0; padding-bottom: 80px; animation: pageIn .45s ease both; }
        header { background: white; padding: 15px 40px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-bottom: 5px solid var(--primary-color); }
        .header-title h1 { margin: 0; color: var(--primary-color); font-size: 1.8rem; font-weight: bold; }
        .logo { width: 80px; height: auto; object-fit: contain; }
        
        .qr-section { display: flex; justify-content: center; margin-top: 25px; }
        .qr-card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 350px; border: 3px solid var(--primary-color); }
        .qr-card img { width: 180px; height: 180px; margin-bottom: 10px; border: 1px solid #eee; border-radius: 8px; }
        
        .search-section { max-width: 600px; margin: 25px auto 15px; padding: 0 20px; }
        .search-box { position: relative; }
        .search-box input { width: 100%; padding: 15px 45px 15px 20px; border-radius: 30px; border: 2px solid #ddd; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box; }
        .search-box input:focus { border-color: var(--primary-color); box-shadow: 0 0 10px rgba(0,74,153,0.15); }
        .search-box i { position: absolute; right: 18px; top: 18px; color: #888; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; padding: 20px 40px; max-width: 1200px; margin: auto; }
        .dept-card { --accent:#0878d1; --accent2:#00b4d8; background: linear-gradient(145deg,#fff,#f7fbff); padding: 20px 10px; border-radius: 18px; text-align: center; box-shadow: 0 6px 18px rgba(0,44,88,.09); cursor: pointer; transition: transform .28s,box-shadow .28s,border-color .28s; text-decoration: none; border: 1px solid #e6eef6; display: flex; flex-direction: column; align-items: center; justify-content: center; animation: cardRise .45s ease both; }
        .dept-card:nth-child(2n){--accent:#6938c9;--accent2:#a855f7}.dept-card:nth-child(3n){--accent:#008f68;--accent2:#2dd4bf}.dept-card:nth-child(4n){--accent:#d35400;--accent2:#f59e0b}
        .dept-card:hover { transform: translateY(-8px) scale(1.025); border-color: var(--accent); box-shadow: 0 14px 28px color-mix(in srgb,var(--accent) 23%,transparent); }
        .dept-card i { width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size: 2rem; color:#fff; margin-bottom: 12px; background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 32%,transparent); transition:transform .28s; }
        .dept-card:hover i{transform:rotate(-5deg) scale(1.08)}
        .dept-name { font-size: 1rem; font-weight: bold; color: #333; }
        @keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes cardRise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
        
        .student-files-card { background: #8e44ad !important; color: white !important; }
        .staff-card { background: #2c3e50 !important; color: white !important; }
        .employee-login-card { background: #16a085 !important; color: white !important; }
        .admin-card { background: #0f172a !important; color: white !important; }
        .print-card { background: #e67e22 !important; color: white !important; }
        .student-files-card i, .staff-card i, .employee-login-card i, .print-card i, .admin-card i { color: white !important; }
        .student-files-card .dept-name, .staff-card .dept-name, .employee-login-card .dept-name, .print-card .dept-name, .admin-card .dept-name { color: white !important; }

        .bottom-nav{position:fixed;bottom:0;right:0;left:0;background:#fff;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:0 -4px 18px #0002;z-index:9999;border-top:1px solid #dce3ea}.bottom-nav a{padding:11px 4px;text-decoration:none;color:#334155;text-align:center;font-size:.83rem;font-weight:bold}.bottom-nav i{display:block;font-size:1.35rem;margin-bottom:5px}.bottom-nav a.active{color:var(--primary-color);background:#eef6ff}@media(max-width:650px){header{padding:10px}.logo{width:55px}.header-title h1{font-size:1.25rem}.grid-container{padding:12px;grid-template-columns:repeat(2,1fr)}.dept-card{min-height:110px}}
    </style>
</head>
<body>

<header>
    <img src="assets/library_logo.png" alt="Logo" class="logo" onerror="this.src='assets/download.jpg'">
    <div class="header-title text-center">
        <h1>مكتبة كلية الهندسة</h1>
        <p style="margin: 5px 0 0; color: #666; font-size: 0.95rem;">الجامعة العراقية - المنظومة الرقمية الشاملة</p>
    </div>
    <img src="assets/library_logo.png" alt="Logo" class="logo" onerror="this.src='assets/download.jpg'">
</header>

<!-- صندوق البحث -->
<div class="search-section">
    <div class="search-box">
        <i class="fas fa-search"></i>
        <input type="text" id="deptSearch" placeholder="ابحث عن قسم هندسي..." onkeyup="filterDepts()">
    </div>
</div>

<!-- شبكة الأقسام والخدمات -->
<div class="grid-container" id="deptsGrid">
    <div class="dept-card" onclick="openDept('computer', 'هندسة الحاسوب')">
        <i class="fas fa-microchip"></i><div class="dept-name">هندسة الحاسوب</div>
    </div>
    <div class="dept-card" onclick="openDept('networks', 'هندسة الشبكات والأمن السيبراني')">
        <i class="fas fa-network-wired"></i><div class="dept-name">هندسة الشبكات والأمن السيبراني</div>
    </div>
    <div class="dept-card" onclick="openDept('civil', 'الهندسة المدنية')">
        <i class="fas fa-drafting-compass"></i><div class="dept-name">الهندسة المدنية</div>
    </div>
    <div class="dept-card" onclick="openDept('ai', 'الذكاء الاصطناعي')">
        <i class="fas fa-brain"></i><div class="dept-name">الذكاء الاصطناعي</div>
    </div>
    <div class="dept-card" onclick="openDept('electric', 'هندسة الكهرباء')">
        <i class="fas fa-bolt"></i><div class="dept-name">هندسة الكهرباء</div>
    </div>
    <div class="dept-card" onclick="openDept('architecture', 'الهندسة المعمارية')">
        <i class="fas fa-building"></i><div class="dept-name">الهندسة المعمارية</div>
    </div>
    <div class="dept-card" onclick="openDept('energy', 'هندسة الطاقة والطاقة المتجددة')">
        <i class="fas fa-solar-panel"></i><div class="dept-name">هندسة الطاقة والطاقة المتجددة</div>
    </div>
    
</div>

<nav class="bottom-nav"><a class="active" href="index.html"><i class="fas fa-book-open"></i>واجهة الملازم</a><a href="students.html"><i class="fas fa-user-graduate"></i>بوابة الطلاب</a><a href="staff.html"><i class="fas fa-users-gear"></i>الكادر والإدارة</a></nav>

<script>
    // 1. توليد الـ QR تلقائياً بالاعتماد على IP السيرفر المباشر
    window.onload = async function() {
        try {
            const departments = await (await fetch('/api/departments')).json();
            const grid = document.getElementById('deptsGrid');
            departments.forEach(d => {
                if (grid.querySelector(`[data-dept="${d.code}"]`) || [...grid.children].some(x => x.getAttribute('onclick')?.includes(`'${d.code}'`))) return;
                const card = document.createElement('div'); card.className='dept-card'; card.dataset.dept=d.code;
                card.onclick=()=>openDept(d.code,d.name); card.innerHTML=`<i class="fas ${d.icon||'fa-graduation-cap'}"></i><div class="dept-name">${d.name}</div>`;
                grid.appendChild(card);
            });
        } catch(e) { console.log('تعذر تحميل الأقسام الديناميكية'); }
    };

    // 2. تصفية الأقسام والخدمات أثناء البحث
    function filterDepts() {
        let query = document.getElementById('deptSearch').value.toLowerCase();
        query = query.replace(/[أإآ]/g, 'ا');

        const cards = document.getElementsByClassName('dept-card');
        for (let card of cards) {
            let text = card.innerText.toLowerCase().replace(/[أإآ]/g, 'ا');
            card.style.display = text.includes(query) ? "flex" : "none";
        }
    }

    // 3. التوجيه إلى صفحة المراحل الدراسية للقسم المختار
    function openDept(id, name) {
        window.location.href = `stages.html?dept=${id}&name=${encodeURIComponent(name)}`;
    }

    // 4. الطباعة السريعة من الفلاش
    function quickPrint(event) {
        const file = event.target.files[0];
        if (file) {
            const url = URL.createObjectURL(file);
            const win = window.open(url, '_blank');
            if (win) win.onload = () => win.print();
        }
    }

    // 5. تسجيل الـ Service Worker لتفعيل الـ PWA
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('PWA Service Worker Registered!'))
                .catch(err => console.log('PWA Registration Failed:', err));
        });
    }
</script>
<script src="/notifications.js"></script></body>
</html>
